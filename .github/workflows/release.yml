name: release

# Runs when the owner publishes a GitHub release (tag vX.Y.Z). It tests the tagged commit, checks that the tag matches
# the package version, builds the sdist and wheel, checks them, writes SHA256SUMS and a CycloneDX SBOM, attests build
# provenance, publishes to PyPI through Trusted Publishing (no token stored here), and attaches every file to the
# GitHub release. PyPI's trusted publisher is bound to this file name (release.yml) and the `pypi` environment:
# renaming either breaks publishing. See docs/INSTALL.md and docs/CI.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Tag is v + the version in every version file (pyproject, __init__, plugin.json, CITATION.cff)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_version.py "$TAG"
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check .
      - name: Unit tests (also check that every version field and pinned install command match)
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  build:
    name: Build and check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hash-pinned build, setuptools and twine; --no-isolation below builds with exactly these.
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - name: Build sdist and wheel
        run: |
          # Commit time as the build timestamp, so a rebuild of the same commit gives the same archives.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Smoke test the installed wheel (entry points, packaged data, local lab scan)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python scripts/smoke_wheel.py "$RUNNER_TEMP/wheel-env/bin"
      - name: SBOM and checksums
        run: |
          mkdir extras
          python scripts/make_sbom.py dist > extras/agent-security-audit.cdx.json
          cp dist/* extras/
          (cd extras && sha256sum -- *.whl *.tar.gz agent-security-audit.cdx.json > SHA256SUMS && cat SHA256SUMS)
          rm extras/*.whl extras/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras
          path: extras/
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extras
          path: extras/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            extras/*

  publish:
    name: Publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/agent-security-audit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-assets:
    name: Attach files to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extras
          path: extras/
      - name: Upload the sdist, wheel, SHA256SUMS and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* extras/* --repo "$GITHUB_REPOSITORY"
