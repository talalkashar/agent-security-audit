name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per branch or PR; a new push cancels the stale run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # ruff is pinned (with hashes) so a new release with different defaults cannot break CI on its own.
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 10
    # Every supported Python on every GitHub-hosted OS. setup-python ships 3.11-3.14
    # for ubuntu-latest, macos-latest (arm64) and windows-latest, so no combo is excluded.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        # bash exists on all three runners (Git Bash on Windows), so one script works everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the entry points
        run: |
          asa list >/dev/null
          asa-mcp </dev/null

  wheel:
    name: Wheel (${{ matrix.os }})
    # Builds the sdist and wheel, checks them, installs the wheel into a clean venv (not editable) and runs the
    # entry points and a local lab scan from outside the source tree, so missing package data shows up here.
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Version files agree
        run: python scripts/release_version.py
      # The build backend comes from the hash-pinned file too (--no-isolation), not a fresh unpinned setuptools.
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ -d "$RUNNER_TEMP/wheel-env/Scripts" ]; then bin="$RUNNER_TEMP/wheel-env/Scripts"; else bin="$RUNNER_TEMP/wheel-env/bin"; fi
          # No index: the wheel alone must install (it has no dependencies) and nothing else can come in.
          "$bin/python" -m pip install --no-index --no-deps dist/*.whl
          echo "WHEEL_BIN=$bin" >> "$GITHUB_ENV"
      - name: Smoke test the installed wheel (asa --version, asa lab scans)
        run: python scripts/smoke_wheel.py "$WHEEL_BIN"
      - name: Lab end-to-end and catalog tests against the installed wheel, outside the source tree
        run: |
          mkdir "$RUNNER_TEMP/wheel-tests"
          cp -R tests "$RUNNER_TEMP/wheel-tests/"
          cd "$RUNNER_TEMP/wheel-tests"
          "$WHEEL_BIN/python" -m unittest tests.test_lab_e2e tests.test_catalog
