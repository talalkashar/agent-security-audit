name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per branch or PR; a new push cancels the stale run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      # ruff is pinned so a new release with different defaults cannot break CI on its own.
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 10
    # Every supported Python on every GitHub-hosted OS. setup-python ships 3.11-3.14
    # for ubuntu-latest, macos-latest (arm64) and windows-latest, so no combo is excluded.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        # bash exists on all three runners (Git Bash on Windows), so one script works everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the entry points
        run: |
          asa list >/dev/null
          asa-mcp </dev/null
