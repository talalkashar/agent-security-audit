name: scorecard

# OpenSSF Scorecard grades the repo's supply-chain practices (pinned actions,
# token permissions, branch protection, ...). It only publishes results and the
# badge once the repository is public; on a private repo the run reports nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2" # weekly, Tuesday 07:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # required by publish_results to sign the upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # ossf/scorecard-action v2.5.0, resolved with:
      # git ls-remote https://github.com/ossf/scorecard-action 'refs/tags/v2.5.0^{}'
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
