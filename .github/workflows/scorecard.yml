name: scorecard

# OpenSSF Scorecard grades the repo's supply-chain practices (pinned actions,
# token permissions, branch protection, ...). It only publishes results and the
# badge once the repository is public; on a private repo the run reports nothing.
# publish_results requires no top-level env/defaults and an allow-listed set of actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2" # weekly, Tuesday 07:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    # Public launch enables this job; private repositories need paid code-scanning access.
    if: ${{ !github.event.repository.private }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # required by publish_results to sign the upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ossf/scorecard-action v2.5.0, resolved with:
      # git ls-remote https://github.com/ossf/scorecard-action 'refs/tags/v2.5.0^{}'
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
