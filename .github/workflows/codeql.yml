name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC

permissions:
  contents: read

concurrency:
  # One run per branch or PR; a new push cancels the stale run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Public launch enables this job; private repositories need paid code-scanning access.
    if: ${{ !github.event.repository.private }}
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # github/codeql-action v4.39.3 (v3 is deprecated; v4 is the current major).
      # Resolved with: git ls-remote https://github.com/github/codeql-action 'refs/tags/v4.39.3^{}'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
