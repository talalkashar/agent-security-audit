[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-audit"
version = "0.2.0"
description = "Security checks a coding agent builds in and then proves on the running site."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Talal Kashar" }]
keywords = ["security", "owasp", "asvs", "nextjs", "supabase", "mcp", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/talalkashar/agent-security-audit"
Documentation = "https://github.com/talalkashar/agent-security-audit#readme"
Changelog = "https://github.com/talalkashar/agent-security-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/talalkashar/agent-security-audit/issues"
Security = "https://github.com/talalkashar/agent-security-audit/security/policy"

[project.scripts]
asa = "agent_security_audit.cli:main"
agent-security-audit = "agent_security_audit.cli:main"
asa-mcp = "agent_security_audit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_security_audit = ["catalog/*.toml", "skill/SKILL.md"]
