[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-audit"
version = "0.1.0"
description = "Security checks a coding agent builds in and then proves on the running site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Talal Kashar" }]
keywords = ["security", "owasp", "asvs", "nextjs", "supabase", "mcp", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/talalkashar/agent-security-audit"

[project.scripts]
asa = "agent_security_audit.cli:main"
agent-security-audit = "agent_security_audit.cli:main"
asa-mcp = "agent_security_audit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_security_audit = ["catalog/*.toml"]
