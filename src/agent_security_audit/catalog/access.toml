# access: who can read or change which rows, files and functions (Supabase RLS, storage, object and function authorization).

[[check]]
id = "ACCESS-01"
title = "Supabase tables not readable with the public anon key"
severity = "critical"
layer = 7
cwe = ["CWE-862", "CWE-284"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "auto"
probe = "active"
stacks = ["supabase"]
risk = """The anon (publishable) key is public by design, and Supabase's Data API serves every table in an exposed schema to anyone holding it; on existing projects new public tables are granted to anon by default, so RLS is the only gate. CVE-2025-48757: Lovable-built apps without working RLS let anyone read and write their tables (the researcher reported about 170 of 1,645 apps exposed; the CVE is disputed). Moltbook: a Supabase key in client JavaScript plus no RLS exposed the whole production database."""
build = """Every `create table` in an exposed schema is followed in the same migration by `alter table ... enable row level security;` and an explicit policy per needed operation. Keep internal tables in a non-exposed schema (e.g. `private`), or revoke default privileges from `anon, authenticated` so exposure is opt-in. Run `supabase db lint` or the Security Advisor in CI and fail on ERROR (lint 0013 `rls_disabled_in_public`). The anon key in the bundle is expected; a service_role key is NEXT-01."""
proof = """1. The tool finds the Supabase project URL and anon key in the site's public JavaScript.
2. It takes the table names from `--supabase-table` (best: copy them from the repo's migrations), else from `.from('<table>')` calls in the site's JavaScript. Listing tables from the API root (`GET /rest/v1/`) is only a fallback: Supabase stopped serving it to the anon key in 2026 (new projects from 11 March, all projects from 8 April), so it usually answers 401 and the check reports manual.
3. For each table it sends one HEAD request with the anon key only (no user token, `limit=1`, `Prefer: count=exact`). A HEAD answer has no body, so no row is downloaded; the `Content-Range` header says how many rows the key can see.
4. It reports table names and row counts only, never row contents.
Pass: every table answers 401 or 403. Fail: any table shows one or more rows. Warning: a table shows zero rows (RLS filtering, or the table is empty). Manual: a table answers 404 (not a table in the exposed schema: a typo or a storage bucket) or anything else that does not prove a refusal."""
sources = [
  { title = "Supabase: Row Level Security", url = "https://supabase.com/docs/guides/database/postgres/row-level-security" },
  { title = "Supabase: Securing your API", url = "https://supabase.com/docs/guides/api/securing-your-api" },
  { title = "Supabase changelog: anon key loses access to the OpenAPI spec (2026)", url = "https://supabase.com/changelog/42949-breaking-change-removing-access-to-openapi-spec-via-the-anon-key" },
  { title = "Supabase: Database Advisors (lint 0013)", url = "https://supabase.com/docs/guides/database/database-advisors" },
  { title = "Statement on CVE-2025-48757 (reporting researcher)", url = "https://welcome-b52.pages.dev/posts/2025/05/statement-on-CVE-2025-48757" },
  { title = "SecurityOnline: CVE-2025-48757, Lovable RLS breakdown", url = "https://securityonline.info/cve-2025-48757-lovables-row-level-security-breakdown-exposes-sensitive-data-across-hundreds-of-projects/" },
  { title = "TechRadar: Moltbook database left unsecured", url = "https://www.techradar.com/pro/security/ai-agent-social-media-network-moltbook-is-a-security-disaster-millions-of-credentials-and-other-details-left-unsecured" },
  { title = "Escape.tech: vulnerabilities in vibe-coded apps", url = "https://escape.tech/blog/methodology-how-we-discovered-vulnerabilities-apps-built-with-vibe-coding/" },
]

[[check]]
id = "ACCESS-02"
title = "RLS policies restrict rows to their owner, not any signed-in user"
severity = "critical"
layer = 7
cwe = ["CWE-863", "CWE-639"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "assisted"
stacks = ["supabase"]
risk = """A policy of `using (true)` or "any authenticated user" turns RLS on in name only. Self-signup is usually open, so "authenticated" means anyone, and every account can read every user's rows. Checks that only ask "is RLS enabled" miss this."""
build = """Every policy on user-owned data compares a row column to the caller: `using ((select auth.uid()) = user_id)`. Scope with `to authenticated`, name the operation (`for select`, not `for all`) unless all are intended, and add `auth.uid() is not null` where the owner column is nullable. A table that is public by design carries a comment saying so. Index the policy column. Security Advisor lint 0024 `permissive_rls_policy` must be clear."""
proof = """1. Create test accounts A and B. As B, create a row through the app in each table that holds user data.
2. As A (A's access token plus the anon key), request B's row by id through PostgREST.
3. As A, request the table with `Prefer: count=exact`.
Pass: step 2 returns no rows and the step 3 count equals A's own rows. Fail: B's row or a larger count appears. If other people's real data appears, record a fail with the route and record count, never the values."""
sources = [
  { title = "Supabase: Row Level Security", url = "https://supabase.com/docs/guides/database/postgres/row-level-security" },
  { title = "Supabase: Database Advisors (lints 0006, 0024)", url = "https://supabase.com/docs/guides/database/database-advisors" },
]

[[check]]
id = "ACCESS-03"
title = "Insert and update policies stop rows being assigned to another user"
severity = "high"
layer = 7
cwe = ["CWE-639", "CWE-863"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "assisted"
stacks = ["supabase"]
risk = """`USING` limits which rows a user can touch; `WITH CHECK` limits what the new or changed row may contain. Without it a user can create rows owned by someone else or move a row into another account. CVE-2024-45489 (Arc browser): access rules let a user change a Boost's creator after creation, attaching code to another user's browser."""
build = """Insert policies: `with check ((select auth.uid()) = user_id)`. Update policies carry both `using` and `with check` on ownership. Set ownership columns server-side (`default auth.uid()`) and revoke client update on ownership and tenant columns (ACCESS-05). Do not write `for all using (...)` without a matching insert check."""
proof = """1. As test account A, insert a row whose `user_id` is test account B's id.
2. As A, update A's own test row, setting `user_id` to B's id.
Pass: both are rejected (403 / RLS violation 42501) or change 0 rows. Fail: either succeeds.
3. Delete any rows A created."""
sources = [
  { title = "Supabase: Row Level Security", url = "https://supabase.com/docs/guides/database/postgres/row-level-security" },
  { title = "eva: Arc browser Boosts vulnerability (CVE-2024-45489)", url = "https://www.eva.ac/blog/arc/" },
  { title = "Techzine: Arc browser leak fixed after one day", url = "https://www.techzine.eu/news/applications/124668/leak-in-arc-browser-fixed-after-one-day" },
]

[[check]]
id = "ACCESS-04"
title = "Authorization never trusts user_metadata"
severity = "high"
layer = 7
cwe = ["CWE-807", "CWE-269"]
owasp = ["A01:2021", "A01:2025", "API5:2023"]
mode = "assisted"
stacks = ["supabase"]
risk = """`user_metadata` (`raw_user_meta_data`) is writable by the user through `auth.updateUser()` or sign-up options. A policy or server check such as "role in user_metadata is admin" lets any user promote themselves."""
build = """Store roles in a `user_roles` or `memberships` table with RLS and no client write policy, or in `app_metadata`, which only the server can set (it reaches the JWT after a token refresh). No policy, middleware or server code may read `user_metadata` / `raw_user_meta_data` for an authorization decision. Security Advisor lint 0015 `rls_references_user_metadata` must be clear."""
proof = """1. Search policies, migrations and server code for `user_metadata` and `raw_user_meta_data`; each hit must be outside authorization logic.
2. As test account A, set a role or admin flag in A's own user metadata, refresh the session, and request an admin-only page, route or table.
Pass: still denied (401/403/redirect or no rows). Fail: admin access granted.
3. Reset A's metadata."""
sources = [
  { title = "Supabase: Row Level Security", url = "https://supabase.com/docs/guides/database/postgres/row-level-security" },
  { title = "Supabase: Database Advisors (lint 0015)", url = "https://supabase.com/docs/guides/database/database-advisors" },
]

[[check]]
id = "ACCESS-05"
title = "Privileged columns not writable by their row owner"
severity = "high"
layer = 7
cwe = ["CWE-915"]
owasp = ["A01:2021", "A08:2021", "A01:2025", "A08:2025", "API3:2023"]
mode = "assisted"
stacks = ["supabase", "nextjs"]
risk = """RLS works on rows, not columns: an owner-update policy lets the owner change every column, including `role`, `is_admin`, `plan`, `credits` or `org_id`. Route handlers and server actions that pass request JSON straight into `.update(body)` or `.insert({...body})` have the same flaw (mass assignment)."""
build = """Keep privileged fields in a separate table with no client write policy, or revoke table-wide update and grant update on safe columns only (`grant update (name, avatar_url) on profiles to authenticated`). In server code, parse input with a strict schema (Zod `.strict()` or explicit picks) and build the database payload from parsed fields only; never pass `body` or `formData` objects through."""
proof = """1. From the schema, list privileged columns on tables users can update.
2. As test account A, update A's own row through PostgREST and through each app endpoint or server action that edits it, adding one privileged column.
3. Re-read the row.
Pass: the request is rejected or the privileged column is unchanged. Fail: it changed.
4. Revert any change."""
sources = [
  { title = "OWASP Mass Assignment Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html" },
  { title = "Supabase: Column level security", url = "https://supabase.com/docs/guides/database/postgres/column-level-security" },
]

[[check]]
id = "ACCESS-06"
title = "Views and security definer functions do not bypass RLS"
severity = "high"
layer = 7
cwe = ["CWE-863", "CWE-250"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "review"
stacks = ["supabase"]
risk = """Views created by `postgres` ignore the RLS of their tables unless `security_invoker = true`. A `security definer` function in an exposed schema is callable at `/rest/v1/rpc/<fn>` with its creator's privileges, by anon unless EXECUTE is revoked. A view over `auth.users` exposes every user's email."""
build = """Create views `with (security_invoker = true)`. Put security definer functions in a non-exposed schema, `set search_path = ''`, schema-qualify names, check `auth.uid()` inside, and `revoke execute ... from public, anon`, granting only what is needed. Never expose `auth.users` through a view; copy needed fields into `public.profiles` with RLS."""
proof = """1. Query `pg_class.reloptions` for views in exposed schemas without `security_invoker=true`, and `pg_proc.prosecdef` for security definer functions in exposed schemas.
2. Read the Security Advisor for lints 0002, 0010, 0011, 0028, 0029.
Pass: none found, or each is justified in writing and its EXECUTE is revoked from anon. Fail: any unjustified finding."""
sources = [
  { title = "Supabase: Row Level Security", url = "https://supabase.com/docs/guides/database/postgres/row-level-security" },
  { title = "Supabase: Database Advisors", url = "https://supabase.com/docs/guides/database/database-advisors" },
]

[[check]]
id = "ACCESS-07"
title = "Shared tables expose only intended columns"
severity = "high"
layer = 7
cwe = ["CWE-200", "CWE-213"]
owasp = ["A01:2021", "A01:2025", "API3:2023"]
mode = "assisted"
stacks = ["supabase", "nextjs"]
risk = """A table others may read (profiles, directory, leaderboard) exposes every column, not just what the UI shows: a client can select all columns and filter by email or phone. Passing whole database rows to client components leaks the same fields. Escape.tech counted 175 PII exposures (emails, phone numbers, IBANs, medical data) in scanned vibe-coded apps."""
build = """Split public and private fields into separate tables (`profiles` vs owner-only `profiles_private`), or expose a `security_invoker` view with safe columns and revoke direct select; use column grants where a split is impractical. In Next.js, the data layer returns objects with explicit fields and data modules `import 'server-only'`. Security Advisor lint 0023 `sensitive_columns_exposed` is only a partial signal: it flags sensitive-looking columns on tables without RLS, not over-wide columns on tables that have RLS, so a clear lint does not pass this check."""
proof = """1. As anon and as test account A, request one row with all columns from each shared table.
2. Load pages that show other users as A and search the HTML and RSC payload for test account B's email and phone.
Pass: no columns named like email, phone, address, dob, token, stripe_*, ssn or password beyond those intentionally public, and B's private fields absent. Fail: any present. Report column names only."""
sources = [
  { title = "Supabase: Database Advisors (lints 0023, 0026)", url = "https://supabase.com/docs/guides/database/database-advisors" },
  { title = "Next.js: How to Think About Security in Next.js", url = "https://nextjs.org/blog/security-nextjs-server-components-actions" },
  { title = "Escape.tech: vulnerabilities in vibe-coded apps", url = "https://escape.tech/blog/methodology-how-we-discovered-vulnerabilities-apps-built-with-vibe-coding/" },
]

[[check]]
id = "ACCESS-08"
title = "Secret-key client used only off user request paths"
severity = "critical"
layer = 7
cwe = ["CWE-250", "CWE-862"]
owasp = ["A01:2021", "A04:2021", "A01:2025", "A06:2025"]
mode = "review"
stacks = ["supabase", "nextjs"]
risk = """The `service_role` / `sb_secret_` key bypasses every RLS policy. Server code that uses it for ordinary user requests silently switches RLS off, so any missing ownership check in that code becomes a data leak."""
build = """The admin (secret-key) client lives in a `server-only` module and is used only for webhooks, cron and admin jobs. User-facing route handlers, server actions and pages use the cookie-bound user client (`@supabase/ssr` `createServerClient`) so RLS applies. The key never appears in a `NEXT_PUBLIC_*` variable or the bundle (NEXT-01). Rotate it immediately if it was ever exposed."""
proof = """1. List every import site of the admin client.
2. For each, confirm it is not reachable from a user-facing page, route handler or server action, or that it checks ownership itself before every query.
3. Confirm no `NEXT_PUBLIC_*` name holds `SERVICE_ROLE` or `sb_secret`.
Pass: every use is a webhook, cron or admin job, or is ownership-checked. Fail: any user request path uses it unchecked."""
sources = [
  { title = "Supabase: API keys", url = "https://supabase.com/docs/guides/api/api-keys" },
  { title = "Escape.tech: vulnerabilities in vibe-coded apps", url = "https://escape.tech/blog/methodology-how-we-discovered-vulnerabilities-apps-built-with-vibe-coding/" },
]

[[check]]
id = "ACCESS-09"
title = "Storage buckets private, unlistable and scoped to each user's folder"
severity = "high"
layer = 7
cwe = ["CWE-284", "CWE-552"]
owasp = ["A01:2021", "A05:2021", "A01:2025", "A02:2025", "API1:2023"]
mode = "assisted"
stacks = ["supabase"]
risk = """Files such as IDs, selfies and invoices in a public bucket, or behind a broad `storage.objects` select policy, can be listed and downloaded by anyone. Upload policies that do not bind the path to the user let one user overwrite another's files. Tea app (2025): a public Firebase storage bucket leaked about 72,000 images, including about 13,000 selfies and ID photos."""
build = """Buckets are private by default; files are served through short-lived signed URLs created server-side after an ownership check. Policies key on the path: `(storage.foldername(name))[1] = (select auth.uid()::text)` for select, insert, update and delete. Public buckets hold only truly public assets and have no broad select policy, so they cannot be listed (lint 0025). Unguessable names are defense in depth only."""
proof = """1. As anon, list each bucket with an empty prefix.
2. As anon, fetch a test file uploaded by test account A through the public object URL.
3. As A, download, then try to overwrite, a path in test account B's folder.
Pass: step 1 returns an error or empty for private-data buckets, step 2 returns 400/404, step 3 returns 403. Fail: any succeeds. Use only test-account files."""
sources = [
  { title = "Supabase: Storage access control", url = "https://supabase.com/docs/guides/storage/security/access-control" },
  { title = "Supabase: Database Advisors (lint 0025)", url = "https://supabase.com/docs/guides/database/database-advisors" },
  { title = "The Record: Tea app data breach", url = "https://therecord.media/tea-app-data-breach-stolen-ids-leaked" },
  { title = "BleepingComputer: Tea app leak worsens", url = "https://bleepingcomputer.com/news/security/tea-app-leak-worsens-with-second-database-exposing-user-chats" },
]

[[check]]
id = "ACCESS-10"
title = "Records fetched by id are checked against the caller (IDOR)"
severity = "critical"
layer = 7
cwe = ["CWE-639", "CWE-862"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "assisted"
stacks = ["any"]
risk = """A route handler, server action or `[id]` page loads a record by an id from the URL or body and returns or changes it without checking the caller owns it. This is common where server code uses a secret-key client or a direct Postgres/ORM connection with no RLS. First American Financial (2019): changing a number in a document URL exposed other customers' mortgage documents, up to 885 million records."""
build = """All data access goes through a data access layer whose functions take the user from the session (`supabase.auth.getUser()` or `verifySession()`), never from the request, and scope every query (`where id = $1 and owner_id = $user`). Return 404 for both missing and not-yours. UUIDs are defense in depth, not the control. Middleware alone is not authorization (see NEXT)."""
proof = """1. List routes from the repo (`app/**/route.ts`, `[param]` pages, `'use server'` exports) or by crawling as test account A.
2. As test account B, create one object of each type.
3. As A, request each of B's objects by id through every read, update, delete and export path.
Pass: 403/404/empty and B's objects unchanged. Fail: B's data returned or modified. Touch only test-account objects."""
sources = [
  { title = "OWASP IDOR Prevention Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html" },
  { title = "OWASP API Security Top 10 2023", url = "https://owasp.org/API-Security/editions/2023/en/0x11-t10/" },
  { title = "Security Affairs: First American Financial data leak", url = "https://securityaffairs.com/86164/data-breach/first-american-financial-data-leak.html" },
  { title = "KrebsOnSecurity: First American leaked 885M title insurance records", url = "https://krebsonsecurity.com/2019/05/first-american-financial-corp-leaked-hundreds-of-millions-of-title-insurance-records/" },
]

[[check]]
id = "ACCESS-11"
title = "Server Actions check session and permission before acting"
severity = "high"
layer = 7
cwe = ["CWE-862", "CWE-306"]
owasp = ["A01:2021", "A07:2021", "A01:2025", "A07:2025", "API5:2023"]
mode = "review"
stacks = ["nextjs"]
risk = """Every exported function in a `'use server'` file is a public POST endpoint that anyone holding its id can call with any arguments. Hiding the button, gating the page in a layout or middleware, and TypeScript types do not protect it; `.bind()` arguments are client-controlled."""
build = """The first lines of every server action call `verifySession()` (or `supabase.auth.getUser()`), then check permission on the target object or role, then validate every argument with a schema (Zod). Actions live in `'use server'` modules that only call data-layer functions. Review rule: no exported action without an auth call."""
proof = """1. List every `'use server'` export and confirm each calls the session and permission helper before any database call.
Pass: every action does. Fail: any action reaches the database first, or skips the helper.
2. The runtime replay test (no cookies, then another account's cookies) is owned by NEXT-06; run it there, so one bug is not reported twice."""
sources = [
  { title = "Next.js: Authentication guide", url = "https://nextjs.org/docs/app/guides/authentication" },
  { title = "Next.js: How to Think About Security in Next.js", url = "https://nextjs.org/blog/security-nextjs-server-components-actions" },
]

[[check]]
id = "ACCESS-12"
title = "Admin and internal endpoints require the right role or secret"
severity = "high"
layer = 7
cwe = ["CWE-285", "CWE-269"]
owasp = ["A01:2021", "A01:2025", "API5:2023"]
mode = "assisted"
stacks = ["any"]
risk = """Admin pages, `/api/admin/*` handlers, cron endpoints and role-gated actions that only check "signed in", or rely on not being linked, can be called by any user who signs up. Role checks in client components or layouts do not protect data (OWASP API5, broken function level authorization)."""
build = """Deny by default: a `requireRole('admin')` helper in the data layer, called in every admin route handler, action and page data function. The role comes from a server-only table or `app_metadata`, never `user_metadata` (ACCESS-04). Cron and webhook endpoints require a secret header (e.g. Vercel `CRON_SECRET`) or signature verification."""
proof = """1. List admin and internal routes from the repo (paths with admin, internal, cron or dashboard, and files using the admin client).
2. Request each, with GET and each method it exports, as anon and as a non-admin test account, using no-op inputs.
Pass: 401/403/redirect and no admin data in the body or RSC payload. Fail: 200 with admin content or the action runs. Do not call destructive endpoints."""
sources = [
  { title = "OWASP API Security Top 10 2023", url = "https://owasp.org/API-Security/editions/2023/en/0x11-t10/" },
  { title = "Next.js: Authentication guide", url = "https://nextjs.org/docs/app/guides/authentication" },
]

[[check]]
id = "ACCESS-13"
title = "Tenants cannot reach each other's data"
severity = "critical"
layer = 7
cwe = ["CWE-639", "CWE-668"]
owasp = ["A01:2021", "A01:2025", "API1:2023"]
mode = "assisted"
stacks = ["any"]
risk = """In shared-table multi-tenancy, policies or queries that take `org_id` from the URL, header or body instead of checking membership, or that check the parent table but not child tables, leak data across organizations. Cache keys, storage paths and realtime channels without the tenant leak the same way, and RLS-bypassing server clients drop tenant scoping entirely."""
build = """A `memberships(user_id, org_id, role)` table; every tenant table carries `org_id` with the policy `org_id in (select org_id from memberships where user_id = (select auth.uid()))`, via a security definer helper in a private schema with a fixed search_path, indexed. Child tables carry `org_id` with the same policy or join to the parent. `org_id` from the client is always checked against membership. Include the tenant in cache tags, storage paths and realtime channel authorization."""
proof = """1. Create test account A in test Org1 and test account B in test Org2.
2. As A, request Org2 resources through every path: `/[org2]/...` pages, API routes with Org2 ids, PostgREST filtered to Org2, Org2 storage paths, and child rows by id.
3. As A, insert a row with Org2's `org_id`.
Pass: 403/404/empty everywhere and the insert is rejected. Fail: any Org2 data returned or written."""
sources = [
  { title = "OWASP Multi-Tenant Security Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html" },
  { title = "Next.js: How to Think About Security in Next.js", url = "https://nextjs.org/blog/security-nextjs-server-components-actions" },
]

[[check]]
id = "ACCESS-14"
title = "Supabase Realtime and GraphQL expose no more than REST"
severity = "medium"
layer = 7
cwe = ["CWE-200", "CWE-862"]
owasp = ["A01:2021", "A01:2025", "API1:2023", "API9:2023"]
mode = "assisted"
stacks = ["supabase"]
risk = """Tables in the `supabase_realtime` publication broadcast changes to subscribers, and pg_graphql exposes tables to anon and authenticated. Teams that test only `/rest/v1` miss these channels, and GraphQL introspection maps the whole schema (reported in the Moltbook case)."""
build = """Disable pg_graphql if unused, or revoke usage on `graphql_public` from anon. Add tables to the realtime publication only when needed, rely on RLS for postgres_changes, and use private channels with Realtime Authorization for broadcast and presence. Security Advisor lint 0026 (`pg_graphql_anon_table_exposed`) must be clear. Lint 0027 (`pg_graphql_authenticated_table_exposed`) fires for nearly every table signed-in users can read, so treat it as clear only when pg_graphql is disabled or the GraphQL schema exposure to signed-in users is intended."""
proof = """1. With the anon key only, send a GraphQL introspection query to `/graphql/v1`.
2. As test account A, subscribe to postgres_changes on a user-data table; have test account B change B's own test row.
Pass: step 1 returns an error or only intended types; A receives nothing in step 2. Fail: unintended tables in the schema, or A receives B's change."""
sources = [
  { title = "Supabase: Database Advisors (lints 0026, 0027)", url = "https://supabase.com/docs/guides/database/database-advisors" },
  { title = "Techzine: Moltbook database exposes emails and API keys", url = "https://www.techzine.eu/news/security/138458/moltbook-database-exposes-35000-emails-and-1-5-million-api-keys" },
]

[[check]]
id = "ACCESS-15"
title = "Stored secrets and tokens are encrypted at rest and never client-readable"
severity = "high"
layer = 7
cwe = ["CWE-311", "CWE-312"]
owasp = ["A02:2021", "A04:2025"]
mode = "review"
stacks = ["supabase", "nextjs"]
risk = """Apps that connect to other services store OAuth refresh tokens, API keys and webhook secrets in an ordinary table column. One RLS mistake, a leaked backup or a read-only SQL injection then hands over every connected account. Sensitive personal data (government IDs, health details) in plain columns has the same problem."""
build = """Store third-party secrets in Supabase Vault (`vault.create_secret`, read through `vault.decrypted_secrets` only in server-side functions), or encrypt them in the app with a key kept outside the database. Keep those tables or columns out of every exposed schema, revoke select from anon and authenticated, and read them only with the secret key on the server. Encrypt or omit sensitive personal fields you do not need in clear text."""
proof = """1. Review: list columns whose names or contents look like tokens, keys, secrets or sensitive personal data (`*_token`, `*_key`, `secret`, `ssn`, `dob`).
2. For each, check whether it holds ciphertext or a Vault reference rather than the clear value (look at one test-account row).
3. With the anon key, and with a test account's session, request the table through the Data API.
Pass: values are encrypted or in Vault, and neither role can select them. Fail: any clear-text secret is stored, or either role can read it."""
sources = [
  { title = "Supabase docs: Vault", url = "https://supabase.com/docs/guides/database/vault" },
  { title = "OWASP Top 10 2025: A04 Cryptographic Failures", url = "https://top10.owasp.org/2025/A04_2025-Cryptographic_Failures/" },
  { title = "OWASP Cryptographic Storage Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html" },
]
