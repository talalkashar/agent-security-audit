# api: API routes, Server Actions, input handling, webhooks and abuse of cost-bearing flows.

[[check]]
id = "API-01"
title = "Login endpoint is rate limited (429 + Retry-After)"
severity = "high"
layer = 7
cwe = ["CWE-307", "CWE-770"]
mode = "auto"
probe = "active"
stacks = ["any"]
risk = """Without per-account and per-IP limits on login, signup, password reset and OTP verify, attackers can credential-stuff accounts and brute-force 6-digit codes. Custom routes that check a secret themselves get none of Supabase Auth's built-in limits, and in-memory counters reset per serverless instance."""
build = """Use Supabase Auth's built-in endpoints where possible and keep its limits on. For any custom route or Server Action that checks a password, OTP, reset or invite code, enforce a shared-store limiter (Upstash @upstash/ratelimit sliding window, or a Vercel WAF rate-limit rule on the path), never an in-memory Map. Key it by both client IP and normalized target account, e.g. 5 per 15 min per account and 20 per 15 min per IP. Return 429 with a Retry-After header. Apply the limit inside the handler, not only in middleware (see NEXT checks). Do not reveal whether the account exists. Key IPs correctly (API-14)."""
proof = """1. Run the CLI with --rate-limit-path set to the login endpoint of the user's own site, e.g. /api/auth/login. Without a path the check reports manual.
2. The CLI sends up to N POST requests (default 30, max 60) with fake credentials that match no real account, and stops at the first 429.
3. Pass: a 429 appears within N requests; the CLI notes whether Retry-After is present.
4. Fail: every request returns 200/400/401 with no 429. With fewer than 10 attempts the result is a warning, since that is too few to show no limit exists.
5. Manual follow-up: with an owned test account, confirm the correct password is also refused or challenged during the lockout."""
sources = [
  { title = "OWASP API Security Top 10 2023", url = "https://api-security.owasp.org/editions/2023/en/0x11-t10" },
  { title = "Supabase Auth rate limits", url = "https://supabase.com/docs/guides/auth/rate-limits" },
  { title = "Vercel WAF rate limiting", url = "https://vercel.com/docs/vercel-firewall/vercel-waf/rate-limiting" },
  { title = "Upstash Ratelimit overview", url = "https://upstash.com/docs/redis/sdks/ratelimit-ts/overview" },
]

[[check]]
id = "API-02"
title = "Errors do not leak stack traces or internals"
severity = "medium"
layer = 7
cwe = ["CWE-209", "CWE-215"]
mode = "auto"
probe = "active"
stacks = ["any"]
risk = """Handlers that return err.message or err.stack, or forward Supabase/PostgREST errors verbatim (details, hint, table and constraint names, SQL), hand attackers a map of the schema and code, and confirm when a probe hit something. Upstream API errors can echo keys or internal URLs."""
build = """Route every route handler and Server Action through one handleError() helper: log the full error server-side with a request id, return { error: "Something went wrong", id } with the right status. Map validation errors to field-level messages without echoing internals. Never return Supabase error.details, error.hint or error.message to clients. Run with NODE_ENV=production and no debug flags. Source maps belong to NEXT-02."""
proof = """1. The CLI requests a random path that does not exist on the user's own site.
2. It sends a malformed JSON body to that same path.
3. Pass: both responses are generic (4xx/5xx with a short message) and contain no stack frames, file paths (/var/task, node_modules, C:\\), SQL or PGRST text, or framework internals.
4. Fail: any of those markers appears in either response body.
5. Manual follow-up: send malformed JSON, wrong types and an invalid UUID to each real API route and check the same markers."""
sources = [
  { title = "OWASP API Security Top 10 2023 (API8 Security Misconfiguration)", url = "https://api-security.owasp.org/editions/2023/en/0x11-t10" },
  { title = "Next.js: Error Handling", url = "https://nextjs.org/docs/app/getting-started/error-handling" },
  { title = "OWASP Error Handling Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html" },
]

[[check]]
id = "API-03"
title = "SMS and OTP sending is capped against toll fraud"
severity = "high"
layer = 7
cwe = ["CWE-799", "CWE-770"]
mode = "assisted"
stacks = ["any"]
risk = """Any endpoint that sends an SMS (phone OTP, "text me a link", callback request) can be scripted to send to premium-rate ranges, billing the site owner per message. Email-sending endpoints have the same shape. Limiting per phone number alone fails because numbers rotate. Twitter limited SMS 2FA to paid users in 2023 citing this abuse."""
build = """Put a server-verified CAPTCHA (Turnstile or hCaptcha) before any SMS send. Rate-limit by IP, by session or user, by destination number, plus a global hourly cap per country prefix and a daily spend cap. Allowlist the destination countries you serve (Twilio Verify Geo Permissions or the Supabase SMS provider settings). Prefer Twilio Verify with Fraud Guard over raw Programmable SMS. Keep Supabase's project SMS cap low. Alert on send-volume spikes."""
proof = """1. Use only a phone number the owner controls.
2. Request an OTP 6 times within 2 minutes against the user's own site.
3. Pass: the second request inside 60 s is rejected and by the fourth the endpoint returns 429; a request without a valid CAPTCHA token is rejected 400/403.
4. Fail: all 6 messages arrive.
5. Review config: a country allowlist and a global send cap exist. Never send to numbers the owner does not control."""
sources = [
  { title = "Twilio Verify SMS Fraud Guard", url = "https://www.twilio.com/docs/verify/preventing-toll-fraud/sms-fraud-guard" },
  { title = "Twilio: SMS pumping protection options", url = "https://www.twilio.com/en-us/blog/developers/best-practices/sms-pumping-protection-options" },
  { title = "Supabase Auth rate limits", url = "https://supabase.com/docs/guides/auth/rate-limits" },
  { title = "NBC News: Twitter limits SMS 2FA to paid users", url = "https://www.nbcnews.com/tech/tech-news/twitter-limit-use-text-messages-two-factor-authentication-paid-subscri-rcna71305" },
]

[[check]]
id = "API-04"
title = "Input is schema-validated before use"
severity = "high"
layer = 7
cwe = ["CWE-20"]
mode = "assisted"
stacks = ["nextjs", "supabase"]
risk = """Route handlers and Server Actions receive arbitrary JSON and FormData whatever the TypeScript types say. Passing the body straight into insert or update lets a client set role, is_admin, user_id, price or status. GitHub's 2012 mass-assignment bug (CVE-2012-2055) let a user add his key to the Rails organization."""
build = """Parse every route.ts, Server Action and [param] input with a zod schema using .strict(): allowlisted fields, bounded numbers, length-capped strings, enums for sort fields, z.string().uuid() for ids. Map validated input to an explicit object before insert, update or upsert; never pass body or formData spreads. Set user_id and owner server-side from the session. Protect privileged columns with RLS WITH CHECK and column grants (revoke update (role) on profiles from authenticated). Return DTOs, not raw rows. Reject wrong Content-Type and oversized bodies."""
proof = """1. Sign in with the user's own test account.
2. Send wrong types to each write endpoint (a string where a number belongs, an array where a string belongs, a 100 KB string) and an unknown extra field.
3. Pass: 400 with a generic message, and the unknown field is dropped or rejected. Fail: 500, a stack trace, or the value stored.
4. Review: grep the repo for .insert(body, .update(await req.json()) and formData spreads; each needs a schema parse first.
Writing privileged columns (role, is_admin, plan) through an update is owned by ACCESS-05."""
sources = [
  { title = "Next.js: How to think about data security", url = "https://nextjs.org/docs/app/guides/data-security" },
  { title = "OWASP API Security Top 10 2023 (API3 BOPLA)", url = "https://api-security.owasp.org/editions/2023/en/0x11-t10" },
  { title = "CVE-2012-2055 GitHub mass assignment", url = "https://db.gcve.eu/vuln/fkie_cve-2012-2055" },
  { title = "OWASP Mass Assignment Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html" },
  { title = "OWASP Input Validation Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html" },
]

[[check]]
id = "API-05"
title = "User input never builds PostgREST filter strings"
severity = "high"
layer = 7
cwe = ["CWE-89", "CWE-943"]
mode = "assisted"
stacks = ["supabase"]
risk = """supabase-js .or(), .filter(), .not() and hand-built REST query strings treat , . : ( ) " as syntax. User text concatenated into them can add conditions or change which columns are compared, exposing or modifying rows when RLS is weak or the service-role key is used. CVE-2026-77071 in the n8n Supabase node matched every row this way."""
build = """Pass user values only as arguments to typed builder methods: .eq('id', id), .ilike('name', `%${q}%`). Never interpolate input into .or(), .filter(), .not(), select() column lists or order() column names. If .or() is unavoidable, validate input against a strict allowlist regex (e.g. ^[\\p{L}\\p{N} _-]{1,64}$) or quote it per PostgREST reserved-character rules. Take sort and column names from an enum. RLS must still bound every query (ACCESS checks); service-role code adds explicit ownership filters."""
proof = """1. On the user's own app with seeded test data, submit benign search terms containing reserved characters: a,b then test) then x.y then a quote.
2. Pass: results equal a literal match (usually empty) or a 400 validation error.
3. Fail: a 500 with a PostgREST parse error (PGRST100) in the response, or more rows than a literal match returns.
4. Review: grep the repo for .or( and .filter( called with template literals or string concatenation.
5. Do not attempt to read other users' data."""
sources = [
  { title = "VulnCheck: n8n Supabase node PostgREST filter injection (CVE-2026-77071)", url = "https://www.vulncheck.com/advisories/n8n-before-postgrest-filter-injection-via-supabase" },
  { title = "SignalizeAI issue showing PostgREST filter injection from a search box", url = "https://github.com/SignalizeAI/SignalizeAI-Website/issues/50" },
]

[[check]]
id = "API-06"
title = "Webhooks verify signatures and reject replays"
severity = "critical"
layer = 7
cwe = ["CWE-345", "CWE-290", "CWE-294"]
mode = "assisted"
stacks = ["any"]
risk = """A webhook route is a public URL. If it does not verify the signature over the raw body, anyone can POST a fake checkout.session.completed and get goods, credits or role upgrades. CVE-2026-21894: the n8n Stripe Trigger stored the signing secret but never checked it, so forged events ran workflows."""
build = """In the webhook route read await req.text() and pass it with the Stripe-Signature header to stripe.webhooks.constructEvent(raw, sig, secret); keep the default 300 s tolerance. Never call req.json() before verifying. Fail closed when the secret env var is missing. For other providers use their SDK verifier or an HMAC over the raw body compared with crypto.timingSafeEqual. Store processed event ids under a unique constraint and skip duplicates. Re-fetch the object from the provider before granting anything high value. Never put webhook secrets in NEXT_PUBLIC_ vars. Exclude webhook routes from auth middleware, not from verification."""
proof = """1. Against the user's own webhook route in test mode, POST a well-formed Stripe-like event with no Stripe-Signature header.
2. POST it again with a garbage signature header, then with a header whose timestamp is 1 hour old.
3. Pass: all three return 400/401 and no side effect appears in the database or logs. Fail: 200 and the handler runs.
4. Positive control: stripe trigger checkout.session.completed with the Stripe CLI returns 200; resending the same event id from the Dashboard is processed once."""
sources = [
  { title = "Stripe: Webhook signatures", url = "https://docs.stripe.com/webhooks/signature" },
  { title = "GHSA-jf52-3f2h-h9j5 / CVE-2026-21894 n8n Stripe Trigger missing signature check", url = "https://osv.dev/vulnerability/GHSA-jf52-3f2h-h9j5" },
  { title = "Vercel: x-vercel-signature verification", url = "https://vercel.com/docs/headers/request-headers#x-vercel-signature" },
]

[[check]]
id = "API-07"
title = "Database functions are not over-exposed or injectable"
severity = "high"
layer = 7
cwe = ["CWE-89", "CWE-250", "CWE-285"]
mode = "review"
stacks = ["supabase"]
risk = """supabase.rpc() calls Postgres functions over the public REST API, and by default any role can run them, including anon. SECURITY DEFINER functions bypass RLS, so a missing ownership check or unset search_path becomes an authorization hole. Functions that concatenate arguments into EXECUTE are injectable."""
build = """Prefer security invoker. If security definer is needed: set search_path = '', schema-qualify every table, check auth.uid() ownership in the body, and either move it to a non-exposed schema or revoke execute on function ... from public, anon and grant only to authenticated. In dynamic SQL use EXECUTE format('... %I ...', col) USING val, never ||. Validate rpc arguments with zod in the app too. Run the Supabase security advisor, which flags mutable search_path. Table RLS belongs to ACCESS checks."""
proof = """1. In the database, list functions in exposed schemas with prosecdef = true and no search_path in proconfig. Pass: none, or each sets search_path. Fail: any definer function without it.
2. Grep migrations for EXECUTE with || concatenation. Pass: none, or each uses format() with %I/%L or a parameter. Fail: any concatenated SQL.
3. Optional, with two owned test accounts: call a definer function as account A with account B's id. Pass: empty or 403. Fail: B's data.
Whether definer functions and views bypass RLS, and EXECUTE grants to anon, are owned by ACCESS-06."""
sources = [
  { title = "Supabase: Database functions", url = "https://supabase.com/docs/guides/database/functions" },
  { title = "PostgreSQL: PL/pgSQL executing dynamic commands", url = "https://www.postgresql.org/docs/current/plpgsql-statements.html" },
]

[[check]]
id = "API-08"
title = "Server-side URL fetches cannot reach internal addresses"
severity = "high"
layer = 7
cwe = ["CWE-918"]
mode = "assisted"
stacks = ["any"]
risk = """Features that fetch a user-supplied URL server-side (link previews, import from URL, avatar by URL, outgoing webhook tests, next/image with broad remotePatterns) can be pointed at cloud metadata, localhost admin ports or private services. Redirects and DNS rebinding defeat hostname checks done before the fetch. Capital One's 2019 breach began with SSRF to EC2 metadata; Next.js has shipped SSRF fixes (CVE-2024-34351, CVE-2026-94483)."""
build = """Keep next patched. In next.config images.remotePatterns list exact trusted hostnames plus pathname; no ** hostnames. For any server-side fetch of a user URL: allow only https, resolve DNS and reject private, loopback, link-local, ULA and metadata ranges (IPv4, IPv6 and mapped forms), connect to the resolved IP, disable redirects or re-validate each hop, set a short timeout and a maximum response size, and never return raw upstream bodies or errors. Prefer a domain allowlist when the feature allows it. Run fetchers without cloud credentials in env."""
proof = """1. On the user's own app's URL-taking feature, submit http://127.0.0.1/, http://169.254.169.254/, http://[::1]/ and http://localhost:3000/.
2. Submit a URL on a request-catcher the owner controls that redirects to 127.0.0.1.
3. Pass: all are rejected with 400 before any outbound connection; the catcher sees no follow-up. Fail: 200 with content, or response time/body shows an internal fetch.
4. The Next.js image optimizer (/_next/image) allow list is owned by NEXT-11.
5. Do not probe anyone else's network."""
sources = [
  { title = "Assetnote: Next.js Server Actions SSRF (CVE-2024-34351)", url = "https://www.assetnote.io/resources/research/advisory-next-js-ssrf-cve-2024-34351" },
  { title = "GHSA-cjq9-62q9-8jv4 / CVE-2026-94483 Next.js Image Optimization SSRF", url = "https://osv.dev/vulnerability/GHSA-cjq9-62q9-8jv4" },
  { title = "OWASP SSRF Prevention Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html" },
  { title = "Wiz: Capital One breach (archived)", url = "https://web.archive.org/web/20250716150520/https://threats.wiz.io/all-incidents/capital-one-breach" },
]

[[check]]
id = "API-09"
title = "List endpoints cap page size and query cost"
severity = "medium"
layer = 7
cwe = ["CWE-770", "CWE-400"]
mode = "assisted"
stacks = ["any"]
risk = """Endpoints that take ?limit= or range() from the client, or select('*') without a limit, let one request dump a table or run expensive queries. Supabase caps responses at 1,000 rows by default, a setting developers often raise."""
build = """Validate paging with zod: limit = z.coerce.number().int().min(1).max(100).default(20). Use keyset (cursor) pagination on an indexed column and reject unknown sort columns. Keep Supabase Max rows at 1,000 or lower. Use count: 'estimated' or 'planned' on large tables. Set statement_timeout for the anon and authenticated roles. Cache public list endpoints."""
proof = """1. Call each list endpoint on the user's own site once with ?limit=100000, ?limit=-1 and ?offset=99999999.
2. Call /rest/v1/<table>?select=* with a Range: 0-100000 header for a table the anon key may read.
3. Pass: at most the documented maximum rows, or 400.
4. Fail: thousands of rows, a timeout, or a 500.
5. Run each request once, not in a loop."""
sources = [
  { title = "OWASP API Security Top 10 2023 (API4 Unrestricted Resource Consumption)", url = "https://api-security.owasp.org/editions/2023/en/0x11-t10" },
  { title = "Supabase JS reference: select (1,000 row default)", url = "https://supabase.com/docs/reference/javascript/select" },
  { title = "PostgREST: Pagination and count", url = "https://docs.postgrest.org/en/v12/references/api/pagination_count.html" },
]

[[check]]
id = "API-10"
title = "File uploads are restricted by type and size"
severity = "high"
layer = 7
cwe = ["CWE-434", "CWE-400"]
mode = "assisted"
stacks = ["any"]
risk = """Trusting the client's filename or MIME type lets users upload HTML or SVG with script that is served from your origin (stored XSS), or huge files that exhaust storage and budget. CVE-2026-32753 (FreeScout) and CVE-2024-8029 (PrivateGPT) were both stored XSS through SVG uploads."""
build = """Set Supabase bucket allowed_mime_types and file_size_limit, and validate on the server by magic bytes, not extension. Generate object names server-side (<uid>/<uuid>.<ext>); never use user filenames as paths. Reject SVG, HTML and XML, or re-encode images (sharp). Serve user files from a separate origin such as the Supabase storage domain, with Content-Disposition: attachment for non-images and X-Content-Type-Options: nosniff. Use private buckets and short-lived signed URLs for personal files. Restrict storage policies to the auth.uid() folder. Cap request body size (serverActions.bodySizeLimit)."""
proof = """1. With the user's own test account, upload a harmless SVG containing a script tag renamed to .png, then a file twice the stated size limit.
2. Pass: the type is checked from the content (magic bytes), not the name or the client's Content-Type, and the oversized file is rejected 413/400 before it is stored. Fail: either is stored.
3. Delete the test files afterwards.
How stored files are served (attachment, nosniff, separate origin) is owned by BROWSER-13."""
sources = [
  { title = "CVE-2026-32753 FreeScout SVG upload stored XSS", url = "https://cvefeed.io/vuln/detail/CVE-2026-32753" },
  { title = "CVE-2024-8029 PrivateGPT SVG upload XSS", url = "https://www.sentinelone.com/vulnerability-database/cve-2024-8029/" },
  { title = "OWASP File Upload Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html" },
  { title = "GHSA-9g9p-9gw9-jx7f / CVE-2025-59471 Next.js image optimizer memory DoS", url = "https://osv.dev/vulnerability/GHSA-9g9p-9gw9-jx7f" },
]

[[check]]
id = "API-11"
title = "Public forms verify CAPTCHA tokens on the server"
severity = "medium"
layer = 7
cwe = ["CWE-799", "CWE-602"]
mode = "assisted"
stacks = ["any"]
risk = """Contact, signup, waitlist, booking and newsletter forms get spammed or used to send email from your domain, hurting reputation and cost. A Turnstile or hCaptcha widget without a server-side siteverify call gives no protection."""
build = """Every public form handler first POSTs the token to siteverify with the secret and remoteip, checks success, that hostname equals your domain and that action matches, and fails closed on network error. Enable Supabase Auth CAPTCHA for auth forms. Add a per-IP limiter (e.g. 5 per 10 min) and a honeypot field. Keep the secret out of NEXT_PUBLIC_ vars. Fix email recipients server-side and escape user content placed in outgoing email."""
proof = """1. Submit the user's own form endpoint directly with no token, then with a dummy token, then replaying a token captured from one real browser submission.
2. Pass: all three are rejected 400/403 and no email or database row is created. Fail: any is accepted.
3. Send 10 valid-looking submissions in one minute. Pass: 429 after the configured limit.
4. Use Cloudflare's official test sitekeys on staging."""
sources = [
  { title = "Cloudflare Turnstile: Server-side validation", url = "https://developers.cloudflare.com/turnstile/get-started/server-side-validation/" },
  { title = "Supabase Auth CAPTCHA", url = "https://supabase.com/docs/guides/auth/auth-captcha" },
]

[[check]]
id = "API-12"
title = "LLM endpoints have auth, rate, token and spend caps"
severity = "high"
layer = 7
cwe = ["CWE-770", "CWE-400", "CWE-799"]
mode = "assisted"
stacks = ["any"]
risk = """A public route that proxies to an LLM provider is a free model for anyone who finds it, and every call costs the owner money. Attackers send maximum-length prompts, ask for maximum output tokens, choose the most expensive model through a client parameter, or trigger agent loops. OWASP LLM10:2025 names this unbounded consumption."""
build = """Require a session or a server-verified CAPTCHA token on every LLM route. Rate-limit per user and per IP with a shared store, plus a daily per-user token budget. Cap input length and message count with zod, set max_tokens and the model server-side and ignore client values, set a request timeout and cap tool or agent iterations. Set provider spend limits and alerts, and use project-scoped keys kept in server env only."""
proof = """1. Call the user's own LLM endpoint with no session and no CAPTCHA token. Pass: 401/403.
2. Send 25 tiny prompts in one minute. Pass: 429 at the configured limit.
3. Send a 200 KB prompt. Pass: 400/413 with no upstream call.
4. Send a request naming an expensive model and a huge max_tokens. Pass: logs or response metadata show server defaults were used.
5. Keep total calls under about 30 to limit the owner's cost."""
sources = [
  { title = "OWASP LLM10:2025 Unbounded Consumption", url = "https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/" },
]

[[check]]
id = "API-13"
title = "LLM output cannot exfiltrate data or trigger unapproved actions"
severity = "high"
layer = 7
cwe = ["CWE-1427", "CWE-200", "CWE-77"]
mode = "assisted"
stacks = ["any"]
risk = """When an LLM feature reads untrusted content and also has access to private data or tools, injected instructions can make it leak that data, often through a rendered markdown image or link whose URL carries the data out. Slack AI, Google Bard and Claude were all shown leaking data this way."""
build = """Treat model output as untrusted: render plain text or sanitized markdown with images and links disabled or limited to an allowlist of domains, and limit CSP img-src and connect-src to your own origins. Run retrieval and tools with the end user's Supabase JWT so RLS applies, never the service-role key, and scope retrieval to the current user or tenant. Require explicit user confirmation for high-impact tool calls (send email, delete, pay). Keep secrets out of system prompts. Log tool invocations."""
proof = """1. In a test account on the user's own app, store a document containing a benign canary instruction asking the assistant to output an image whose URL points at an owner-controlled request-catcher.
2. Ask the feature to summarize that document.
3. Pass: no request reaches the catcher, no external image renders, no tool action runs. Fail: the catcher is hit or the image renders.
4. With two test accounts, ask account A's assistant about account B's canary text. Pass: no disclosure."""
sources = [
  { title = "OWASP LLM01:2025 Prompt Injection", url = "https://genai.owasp.org/llmrisk/llm01-prompt-injection/" },
  { title = "PromptArmor: Data exfiltration from Slack AI via indirect prompt injection", url = "https://promptarmor.com/resources/data-exfiltration-from-slack-ai-via-indirect-prompt-injection" },
  { title = "Simon Willison: Hacking Google Bard, from prompt injection to data exfiltration", url = "https://simonwillison.net/2023/Nov/4/hacking-google-bard-from-prompt-injection-to-data-exfiltration/" },
  { title = "Embrace The Red: Anthropic fixes Claude data exfiltration via images", url = "https://embracethered.com/blog/posts/2023/anthropic-fixes-claude-data-exfiltration-via-images" },
  { title = "The Register: Slack AI prompt injection", url = "https://www.theregister.com/2024/08/21/slack_ai_prompt_injection/" },
]

[[check]]
id = "API-14"
title = "Rate limits key on a client IP that cannot be spoofed"
severity = "medium"
layer = 7
cwe = ["CWE-348", "CWE-290"]
mode = "assisted"
stacks = ["any"]
risk = """A limiter keyed on the first X-Forwarded-For value, or on a client-sent X-Real-IP or CF-Connecting-IP, is bypassed by sending a new fake value per request. Keying on one proxy IP instead blocks every user at once. Vercel overwrites X-Forwarded-For; self-hosted setups do not unless configured."""
build = """On Vercel use ipAddress(request) from @vercel/functions or the x-vercel-forwarded-for / x-real-ip headers Vercel sets. Self-hosted: trust only the right-most IP added by your own proxy (configure the trusted proxy count), or a CDN header only when the origin accepts traffic solely from that CDN. Key auth limits by account as well as IP (API-01). If the IP is missing, fall back to one shared bucket."""
proof = """1. Repeat the API-01 login test against the user's own site, adding a different X-Forwarded-For and X-Real-IP value from the 203.0.113.0/24 test range on every request.
2. Pass: 429 still appears at the same count as without the headers.
3. Fail: the limit never triggers.
4. Observe status codes only."""
sources = [
  { title = "Vercel: Request headers", url = "https://vercel.com/docs/headers/request-headers" },
]

[[check]]
id = "API-15"
title = "Prices and amounts are set on the server, never taken from the client"
severity = "high"
layer = 7
cwe = ["CWE-472", "CWE-602"]
mode = "assisted"
stacks = ["any", "nextjs"]
risk = """A checkout route that builds the Stripe Checkout Session or PaymentIntent from an `amount`, `price` or `unit_amount` the browser sent lets anyone pay one cent for anything by editing the request. A webhook that grants what the client asked for, rather than what was paid, has the same effect. OWASP lists this under insecure design and abuse of sensitive business flows."""
build = """The checkout route accepts only a product or price ID and a quantity. It looks up the price and currency on the server (a Stripe Price ID in `line_items[].price`, or a row in your own database), checks the quantity against allowed bounds, and ignores any amount, currency or discount field from the client. Never pass client values into `price_data.unit_amount` or a PaymentIntent `amount`. In the webhook, retrieve the Checkout Session with `line_items` expanded, check `payment_status`, and grant only what those paid line items cover. Webhook signatures are API-06."""
proof = """1. In Stripe test mode, as your own test account, capture the request the site sends to start checkout.
2. Replay it with a changed amount, price, currency or discount field added or edited, and with a negative or huge quantity.
3. Open the resulting Checkout Session in the Stripe Dashboard (test mode) or retrieve it with the API.
Pass: the request is rejected, or the session uses the server's Price and an allowed quantity. Fail: the session total follows the edited value.
4. Review: grep the checkout code for `unit_amount`, `amount:` and `price_data` and confirm none takes a value from the request body.
Use test mode only; never complete a real payment."""
sources = [
  { title = "OWASP API Security Top 10 2023: API6 Unrestricted Access to Sensitive Business Flows", url = "https://api-security.owasp.org/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows/" },
  { title = "OWASP Top 10 2025: A06 Insecure Design", url = "https://top10.owasp.org/2025/A06_2025-Insecure_Design/" },
  { title = "Stripe docs: How products and prices work", url = "https://docs.stripe.com/products-prices/how-products-and-prices-work" },
  { title = "Stripe docs: Fulfill orders (retrieve line_items, check payment_status)", url = "https://docs.stripe.com/checkout/fulfillment" },
]

[[check]]
id = "API-16"
title = "Authorization code fails closed on errors and missing config"
severity = "high"
layer = 7
cwe = ["CWE-636", "CWE-703"]
mode = "review"
stacks = ["any", "nextjs", "supabase"]
risk = """An auth or permission helper that catches an exception and returns true, a check written as `if (user?.role === 'banned') deny` that lets every error through, or a secret compared against `process.env.X` when X is unset, all grant access when something goes wrong. Attackers trigger those error paths on purpose with malformed tokens, timeouts or odd input."""
build = """Write every permission check as allow-listing: grant only when the session is valid and the rule explicitly allows, and deny in every other branch, including `catch`. Read required secrets and config once at startup and refuse to start (or return 500 without acting) when one is missing. Never compare a request value against an env var that may be unset. Do not swallow errors from the session lookup, the database or the policy check; log them and deny."""
proof = """1. Review: grep auth, middleware/proxy, Server Action and route handler code for `catch` blocks, and read each one on an auth or permission path.
Pass: every catch on those paths denies (401/403/redirect) or rethrows. Fail: any catch returns success, `true`, `next()` or the requested data.
2. Grep for `process.env.` used in comparisons (secrets, admin emails, feature flags).
Pass: each has a startup or in-place check that denies when the value is missing. Fail: an unset variable lets the comparison pass.
3. Optional, on a local or staging copy with a test account: unset one required secret, restart, and call a protected route. Pass: it refuses. Fail: it acts."""
sources = [
  { title = "OWASP Top 10 2025: A10 Mishandling of Exceptional Conditions", url = "https://top10.owasp.org/2025/A10_2025-Mishandling_of_Exceptional_Conditions/" },
  { title = "MITRE CWE-636: Not Failing Securely ('Failing Open')", url = "https://cwe.mitre.org/data/definitions/636.html" },
]

[[check]]
id = "API-17"
title = "Every live API route is known, documented and still needed"
severity = "medium"
layer = 7
cwe = ["CWE-1059"]
mode = "review"
stacks = ["any", "nextjs", "vercel"]
risk = """Old `/api/v1` routes, test and debug handlers, and endpoints left behind by a removed feature keep running with the checks they had when they were written. Nobody reviews them, so they miss newer auth and rate limits. Old preview deployments serve the same forgotten code (NEXT-14 covers their access)."""
build = """Keep a short list of every route handler, Server Action module and edge function with its purpose, auth rule and owner (a table in the repo is enough). Delete routes that nothing calls. When a new version replaces a route, remove the old one or make it return 410. Remove debug and test endpoints before deploying."""
proof = """1. List every `route.ts`/`route.js` under `app/`, every file under `pages/api/`, every `'use server'` module and every Supabase edge function.
2. Compare with the documented list.
Pass: every live route is documented with an auth rule, and every documented route exists. Fail: any undocumented, debug, test or superseded route is still deployed.
3. Check the production deployment's function list in the Vercel dashboard against the same list."""
sources = [
  { title = "OWASP API Security Top 10 2023: API9 Improper Inventory Management", url = "https://api-security.owasp.org/editions/2023/en/0xa9-improper-inventory-management/" },
]

[[check]]
id = "API-18"
title = "Responses from third-party APIs are validated before use"
severity = "medium"
layer = 7
cwe = ["CWE-20"]
mode = "review"
stacks = ["any", "nextjs"]
risk = """Server code often trusts what another API returns: it stores the fields as they come, follows redirects, renders HTML from them, or uses them in a database query. A compromised or spoofed provider, or one that changed its format, then injects data or code into your app. OWASP lists this as unsafe consumption of APIs."""
build = """Parse every third-party response with a schema (zod `safeParse`) and use only the parsed fields. Call providers over HTTPS only, with a timeout and a response size limit, and do not follow redirects to other hosts. Treat text from a provider as untrusted user input for rendering (BROWSER-09) and for queries. Verify webhook signatures (API-06) instead of trusting the payload."""
proof = """1. Review: list every server-side `fetch` or SDK call to a third-party API.
2. For each, find where its response is used.
Pass: the response goes through a schema parse, and the call has a timeout and https URL. Fail: raw fields reach the database, HTML or a query, or the call has no timeout.
3. Optional, locally: point one provider URL at a stub that returns extra fields and a wrong type. Pass: the app rejects or ignores them."""
sources = [
  { title = "OWASP API Security Top 10 2023: API10 Unsafe Consumption of APIs", url = "https://api-security.owasp.org/editions/2023/en/0xaa-unsafe-consumption-of-apis/" },
]
