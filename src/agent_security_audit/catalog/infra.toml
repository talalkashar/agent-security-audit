[[check]]
id = "INFRA-19"
title = "Off-site backups exist and a restore has been tested"
severity = "high"
layer = 7
cwe = []
mode = "review"
stacks = ["supabase"]
risk = """A bad migration, a leaked service_role key or an extortion actor who deletes data leaves no way back. Supabase backs up daily with retention by plan and offers point-in-time recovery as a paid add-on; storage buckets are not in database backups. A backup never restored is untested."""
build = """Agree a recovery point with the owner. Run scheduled `supabase db dump` (schema and data) to encrypted storage outside Supabase, or use Pro with PITR for business-critical data. Back up storage buckets separately. Keep every schema change in git migrations."""
proof = """1. Confirm in the dashboard or CLI that the latest backup is under 26 hours old, or PITR is on.
2. Restore the latest off-site dump into a local `supabase start` stack or a throwaway project. Never restore over production.
3. Run row counts on key tables.
4. Pass: restore completes and counts are plausible. Fail: no off-site copy, backup older than the agreed recovery point, or restore fails."""
sources = [
  { title = "Supabase: Database Backups", url = "https://supabase.com/docs/guides/platform/backups" },
  { title = "Unit 42: Large-scale cloud extortion via exposed .env files", url = "https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/" },
]

[[check]]
id = "INFRA-20"
title = "Security events logged durably without secrets"
severity = "medium"
layer = 7
cwe = ["CWE-778", "CWE-532"]
owasp = ["A09:2021", "A09:2025"]
mode = "assisted"
stacks = ["vercel", "supabase"]
risk = """Without durable logs nobody can tell whether a leaked key was used; Toyota could not determine whether its exposed key was abused. Vercel runtime logs are short-lived on Hobby and Pro, so an incident found next week has no evidence. Logging headers or bodies can leak tokens and personal data."""
build = """Log auth events (login success and failure, password reset, role change), admin actions and error spikes server-side with user id and request id; never passwords, tokens, full cookies or card data. Forward logs to a durable sink (log drain or external store) with 30-90 day retention. Add uptime and certificate-expiry monitoring."""
proof = """1. Trigger three failed logins on a test account the owner controls.
2. Search the log sink: pass needs three entries with timestamp, test user id or email hash, IP and outcome, and no password field.
3. Search the last 24 hours of logs for `eyJ`, `sk_live`, `service_role`, `password=`; pass is zero matches.
4. Confirm retention is 30 days or more.
5. Fail: events missing, secrets present, or retention under 7 days."""
sources = [
  { title = "OWASP Logging Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html" },
  { title = "Vercel: Runtime logs", url = "https://vercel.com/docs/runtime-logs" },
  { title = "Vercel: Log drains overview", url = "https://vercel.com/docs/integrations/log-drains-overview" },
  { title = "Infosecurity Magazine: Toyota T-Connect data leak", url = "https://www.infosecurity-magazine.com/news/toyota-data-leak-customers/" },
]

[[check]]
id = "INFRA-21"
title = "Deploys and dashboards used only from trusted networks"
severity = "medium"
layer = 2
cwe = ["CWE-300"]
mode = "review"
stacks = ["any"]
risk = """On open or shared Wi-Fi, another device on the same segment can impersonate the access point or poison ARP to sit on the path, then capture or tamper with traffic from the laptop that holds deploy keys and dashboard sessions. TLS protects most of it, but stripped first requests, unpinned tools and plaintext admin ports do not survive a hostile link."""
build = """Run deploys, database work and dashboard sessions only on a WPA2 or WPA3 network the team controls, or through a VPN when away. Change the router's default admin password, keep its firmware current, and do not share the work network with guests. Teach the team to notice duplicate network names and unexpected certificate warnings."""
proof = """1. Someone on site lists the networks used for deploys and admin work.
2. For each, confirm WPA2 or WPA3 encryption, a non-default router admin password, current firmware, and a separate guest network.
3. Confirm the team uses a VPN on any network it does not control.
4. Pass: all confirmed. Fail: deploys or dashboard logins happen on open or shared Wi-Fi without a VPN."""
sources = [
  { title = "CISA: Securing Wireless Networks", url = "https://www.cisa.gov/news-events/news/securing-wireless-networks" },
  { title = "NIST SP 800-153: Guidelines for Securing Wireless Local Area Networks", url = "https://csrc.nist.gov/pubs/sp/800/153/final" },
]

[[check]]
id = "INFRA-22"
title = "Hosting providers hold current physical-security attestations"
severity = "low"
layer = 1
cwe = ["CWE-1263"]
mode = "review"
stacks = ["vercel", "supabase"]
risk = """The site and its data sit on hardware the owner never sees. Physical access controls at the data centers are only knowable through the provider's audited reports; clients in regulated fields may ask for them."""
build = """Use providers with current SOC 2 Type 2 and ISO 27001 reports covering the regions in use (Vercel and Supabase publish theirs on their trust pages). Choose the Supabase region and Vercel function region deliberately and record them. Request the reports under NDA when a client needs them."""
proof = """1. Open each provider's trust or compliance page.
2. Confirm a current SOC 2 Type 2 report (and ISO 27001 where claimed) and that it covers the region the project uses.
3. Pass: current attestations on file for every provider that stores data. Fail: a provider with no audited attestation, or a report that has lapsed."""
sources = [
  { title = "Vercel: Compliance measures", url = "https://vercel.com/docs/security/compliance" },
  { title = "Vercel Trust Center", url = "https://security.vercel.com" },
  { title = "Supabase: SOC 2 compliance", url = "https://supabase.com/docs/guides/security/soc-2-compliance" },
  { title = "Supabase: Security", url = "https://supabase.com/security" },
]

[[check]]
id = "INFRA-23"
title = "Developer devices encrypted and locked"
severity = "high"
layer = 1
cwe = ["CWE-311", "CWE-1263"]
mode = "review"
stacks = ["any"]
risk = """A lost or stolen laptop holds .env files, CLI tokens for Vercel, Supabase and GitHub, and logged-in browser sessions. Without full-disk encryption and a screen lock, whoever holds the device holds the site."""
build = """Turn on full-disk encryption on every device that touches the code or dashboards (FileVault on macOS, BitLocker on Windows, encryption on phones). Set a screen lock of 5 minutes or less and require a password on wake. Enable remote locate and wipe. Revoke the device's CLI tokens and sessions when it is lost."""
proof = """1. On each device, the owner checks disk encryption status (macOS: `fdesetup status`).
2. Check the screen-lock timeout and password-on-wake setting.
3. Confirm remote wipe is enabled.
4. Pass: all devices encrypted, locked within 5 minutes, and wipeable. Fail: any device missing one."""
sources = [
  { title = "NIST SP 800-111: Storage Encryption Technologies for End User Devices", url = "https://csrc.nist.gov/pubs/sp/800/111/final" },
  { title = "NIST SP 800-124 Rev. 2: Managing the Security of Mobile Devices", url = "https://csrc.nist.gov/pubs/sp/800/124/r2/final" },
  { title = "Apple: Protect data on your Mac with FileVault", url = "https://support.apple.com/guide/mac-help/protect-data-on-your-mac-with-filevault-mh11785/mac" },
]

[[check]]
id = "INFRA-24"
title = "Database, cache and container API ports closed to the internet"
severity = "critical"
layer = 4
cwe = ["CWE-668", "CWE-306"]
owasp = ["A05:2021", "A02:2025"]
mode = "auto"
probe = "active"
stacks = ["any"]
risk = """Redis, Memcached, Elasticsearch, MongoDB and the plain Docker API ship with no authentication or weak defaults, and Postgres, MySQL and SQL Server put only a password between the internet and the data. An open port on the site's address is found by internet-wide scanners within hours and is a common source of data dumps, ransom notes and cryptominers. An open Docker API is root on the host."""
build = """Bind databases, caches and the Docker daemon to localhost or a private network. Put a firewall or security group in front of every server that allows only 80 and 443 from the internet, and reach the rest through a VPN, SSH tunnel or the provider's private networking. Managed databases: turn on network restrictions (INFRA-16). Never expose the Docker socket over TCP without TLS client certificates."""
proof = """1. Resolve the site's hostname and take its first address (moving to the next one if this machine has no route to it, as an HTTPS connection would).
2. Open a TCP connection to 1433, 2375, 3306, 5432, 6379, 9200, 11211 and 27017 on that address, then close it at once. Nothing is sent, no banner is read, no login is tried. Each connection counts against the request budget; `--no-ports` turns the check off.
3. If any port opens, also try port 1 (unused); if that opens too, the address accepts every port and the result is manual.
4. Pass: none of the ports accept a connection and at least one refused it. Fail: any of them does. Manual: every probe timed out, so egress filtering on the scanning network cannot be ruled out. Error: this machine could not reach the address (no route, for example IPv6 without an IPv6 route, or a local firewall). Local development hosts are skipped. Behind a CDN this tests the edge, so also test the origin server's address."""
sources = [
  { title = "OWASP Top 10: A05 Security Misconfiguration", url = "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/" },
  { title = "Redis: Security", url = "https://redis.io/docs/latest/operate/oss_and_stack/management/security/" },
  { title = "MongoDB: Security Checklist", url = "https://www.mongodb.com/docs/manual/administration/security-checklist/" },
  { title = "Docker: Protect the Docker daemon socket", url = "https://docs.docker.com/engine/security/protect-access/" },
  { title = "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy", url = "https://csrc.nist.gov/pubs/sp/800/41/r1/final" },
]

[[check]]
id = "INFRA-25"
title = "Remote administration ports closed to the internet"
severity = "high"
layer = 4
cwe = ["CWE-668", "CWE-319"]
owasp = ["A05:2021", "A02:2025"]
mode = "auto"
probe = "active"
stacks = ["any"]
risk = """Telnet and VNC send passwords in the clear, and an internet-facing Remote Desktop port is a leading entry point for ransomware through password guessing and unpatched flaws. SSH is safer but still draws constant password guessing; open to the whole internet it depends entirely on key-only logins and patching."""
build = """Close Telnet, RDP and VNC to the internet; reach servers through a VPN, a bastion host or the provider's console. Limit SSH to known addresses or a VPN where possible, turn off password logins, and use keys."""
proof = """1. Resolve the site's hostname and take its first address (moving to the next one if this machine has no route to it, as an HTTPS connection would).
2. Open a TCP connection to 22, 23, 3389 and 5900 on that address, then close it at once. Nothing is sent and no login is tried. Each connection counts against the request budget; `--no-ports` turns the check off.
3. If any port opens, also try port 1 (unused); if that opens too, the address accepts every port and the result is manual.
4. Pass: none accept a connection and at least one refused it. Manual: every probe timed out. Error: this machine could not reach the address. Warn: only SSH (22) is open. Fail: Telnet, RDP or VNC is open. Local development hosts are skipped."""
sources = [
  { title = "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy", url = "https://csrc.nist.gov/pubs/sp/800/41/r1/final" },
  { title = "NIST IR 7966: Security of Interactive and Automated Access Management Using SSH", url = "https://csrc.nist.gov/pubs/ir/7966/final" },
  { title = "CISA: Securing Network Infrastructure Devices", url = "https://www.cisa.gov/news-events/news/securing-network-infrastructure-devices" },
]

[[check]]
id = "INFRA-26"
title = "TLS 1.2 refuses broken and non-forward-secret cipher suites"
severity = "medium"
layer = 6
cwe = ["CWE-327"]
owasp = ["A02:2021", "A04:2025", "API8:2023"]
mode = "auto"
stacks = ["any"]
risk = """RC4, 3DES, DES, export-grade and NULL suites can be broken or carry no encryption at all. Suites with static RSA key exchange have no forward secrecy: anyone who records traffic today and obtains the private key later can decrypt all of it. Vercel and most CDNs refuse both, so a server that accepts them is usually self-managed."""
build = """Use the Mozilla "intermediate" configuration: TLS 1.2 with ECDHE or DHE key exchange and AEAD ciphers (AES-GCM, ChaCha20-Poly1305), plus TLS 1.3. On a managed host or CDN pick its modern TLS policy."""
proof = """1. Attempt a TLS 1.2 handshake for each broken family on its own: RC4, 3DES, DES, export and NULL suites.
2. Attempt a TLS 1.2 handshake offering only static RSA key exchange suites.
3. Pass: every handshake is refused with a handshake-failure alert. Warn: only static RSA is accepted. Fail: a broken suite is accepted. Manual: a handshake fails another way (reset, closed connection). Skip when this machine's TLS library cannot offer one of the families; plain HTTP and local hosts are skipped."""
sources = [
  { title = "Mozilla: Server Side TLS", url = "https://wiki.mozilla.org/Security/Server_Side_TLS" },
  { title = "RFC 9325: Recommendations for Secure Use of TLS and DTLS", url = "https://www.rfc-editor.org/rfc/rfc9325" },
  { title = "RFC 7465: Prohibiting RC4 Cipher Suites", url = "https://www.rfc-editor.org/rfc/rfc7465" },
  { title = "OWASP Transport Layer Security Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html" },
]

[[check]]
id = "INFRA-27"
title = "DNSSEC signs the domain and validates"
severity = "low"
layer = 7
cwe = ["CWE-345"]
mode = "auto"
stacks = ["any"]
risk = """Without DNSSEC a resolver cannot tell a forged answer from a real one, so cache poisoning can send visitors and mail elsewhere. A broken DNSSEC setup is worse: validating resolvers, used by a large share of users, return SERVFAIL and the site disappears for them."""
build = """Enable DNSSEC only when the registrar and DNS host both support it with automatic key rollover (most managed DNS providers do it in one click). When moving DNS providers, remove the DS record at the registrar first and add the new one after the move."""
proof = """1. Query DS for the registered domain over DNS-over-HTTPS.
2. Query A for the site's hostname through a validating resolver; on SERVFAIL, repeat with checking disabled (cd=1).
3. Pass: a DS record exists and the answer carries the AD (validated) flag.
4. Warn: no DS record (unsigned), or a DS record but no AD flag. Fail: SERVFAIL when validated but an answer with cd=1, which proves validation is broken. Shared platform domains (vercel.app and similar) are skipped."""
sources = [
  { title = "RFC 4033: DNS Security Introduction and Requirements", url = "https://www.rfc-editor.org/rfc/rfc4033" },
  { title = "ICANN: DNSSEC - What Is It and Why Is It Important?", url = "https://www.icann.org/resources/pages/dnssec-what-is-it-why-important-2019-03-05-en" },
]

[[check]]
id = "INFRA-28"
title = "No dangling CNAME on the site's hostnames (subdomain takeover)"
severity = "high"
layer = 7
cwe = ["CWE-672"]
owasp = ["A05:2021", "A02:2025"]
mode = "auto"
stacks = ["any"]
risk = """When a CNAME points at a cloud resource that was deleted (an Azure app, an Elastic Beanstalk environment, a GitHub Pages site, an S3 bucket), anyone can create a resource with that name and serve their own content, cookies and phishing pages on your domain."""
build = """Delete the DNS record before, or together with, the cloud resource it points to. Keep an inventory of CNAMEs and review it when projects are retired. On Azure, use alias records where possible."""
proof = """1. For the site's hostname and its www or apex twin, query A over DNS-over-HTTPS and read the CNAME chain.
2. If the chain ends in NXDOMAIN, the record is dangling. For the site's own hostname, if the chain ends at github.io or amazonaws.com, also read the home page for the provider's unclaimed-site message.
3. Pass: no dangling CNAME. Warn: a CNAME ends in NXDOMAIN at a provider not known to be claimable; remove it. Fail: NXDOMAIN at a provider where names can be claimed (Azure App Service, Cloud Services, Traffic Manager, Blob Storage, CDN, API Management, Front Door, Elastic Beanstalk), or the provider's unclaimed-site page."""
sources = [
  { title = "OWASP WSTG: Test for Subdomain Takeover", url = "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover" },
  { title = "Microsoft: Prevent dangling DNS entries and avoid subdomain takeover", url = "https://learn.microsoft.com/en-us/azure/security/fundamentals/subdomain-takeover" },
  { title = "can-i-take-over-xyz", url = "https://github.com/EdOverflow/can-i-take-over-xyz" },
]
