2. Request the Studio URL.
3. Pass: ports closed or filtered, and Studio unreachable or behind authentication that does not accept the documented default credentials (test that one pair once, on the owner's own instance).
4. Fail: any port open to the internet, or default credentials accepted."""
sources = [
  { title = "Supabase: Self-hosting with Docker", url = "https://supabase.com/docs/guides/self-hosting/docker" },
