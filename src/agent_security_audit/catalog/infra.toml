[[check]]
id = "INFRA-18"
title = "Self-hosted admin and database ports closed to the internet"
severity = "critical"
layer = 4
cwe = ["CWE-1188", "CWE-306"]
owasp = ["A05:2021", "A02:2025"]
mode = "review"
stacks = ["supabase"]
risk = """Self-hosted Supabase ships with default dashboard credentials and demo keys that must be changed before production. Studio exposed through the API gateway, or Postgres ports open on a public IP, give strangers an admin login prompt or a database socket."""
