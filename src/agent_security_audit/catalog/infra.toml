# infra: transport, DNS, email, secrets, supply chain, accounts, networks and physical security around the site.

[[check]]
id = "INFRA-01"
title = "HTTP redirects to HTTPS"
severity = "high"
layer = 6
cwe = ["CWE-319"]
owasp = ["A02:2021", "A05:2021", "A02:2025", "A04:2025", "API8:2023"]
mode = "auto"
stacks = ["any"]
risk = """Any hostname that serves content over plain HTTP exposes cookies and form data to anyone on the network path. Vercel forces a 308 to HTTPS, so failures come from non-Vercel subdomains (booking, status, docs, old hosts)."""
build = """Serve every hostname through Vercel or another host that forces HTTPS. Keep apex and www both on the project, one redirecting to the other. HSTS belongs to BROWSER-01."""
proof = """1. Request http://<host>/ for the apex, www and every known subdomain, without following redirects.
2. Pass: 301 or 308 with a Location starting https:// on the same host.
3. Pass also: port 80 refuses the connection (nothing is served without TLS).
4. Fail: a 200 (content served over HTTP) or a redirect to another http:// URL. Warning: a temporary redirect (302/307) or a redirect to HTTPS on another host.
5. Manual: port 80 does not answer at all. A silent drop cannot be told apart from a network problem on the way, so open http:// in a browser and confirm it does not load or redirects."""
sources = [
  { title = "Vercel: Encryption and TLS", url = "https://vercel.com/docs/cdn-security/encryption" },
]

[[check]]
id = "INFRA-02"
title = "TLS certificate valid and not near expiry"
severity = "high"
layer = 6
cwe = ["CWE-324"]
owasp = ["A02:2021", "A04:2025", "API8:2023"]
mode = "auto"
stacks = ["any"]
risk = """An expired or mismatched certificate takes the site down and trains users to click through warnings. Microsoft Teams went down on 2020-02-03 because an authentication certificate expired. On Vercel, renewal fails silently when a custom domain's DNS stops pointing at Vercel."""
build = """Keep DNS for every custom domain pointed at the host that renews its certificate. Add an external expiry monitor for every hostname that alerts at 14 days."""
proof = """1. Open a TLS connection to <host>:443 with SNI set to <host> and verify the chain against the system trust store.
2. Read the certificate's subjectAltName and notAfter.
3. Pass: chain verifies, the hostname is in the SAN, and notAfter is 30 or more days away.
4. Warn: fewer than 30 days left (renewal is due). Fail: verification error, hostname missing from the SAN, or 14 days or fewer left. For certificates shorter-lived than 90 days the thresholds shrink to a third and a sixth of the lifetime."""
sources = [
  { title = "Vercel: Encryption and TLS", url = "https://vercel.com/docs/cdn-security/encryption" },
  { title = "TechCrunch: Microsoft Teams outage from expired certificate", url = "https://techcrunch.com/2020/02/03/microsoft-teams-has-been-down-this-morning/amp/" },
]

[[check]]
id = "INFRA-03"
title = "Legacy TLS 1.0 and 1.1 refused"
severity = "medium"
layer = 6
cwe = ["CWE-327"]
owasp = ["A02:2021", "A04:2025", "API8:2023"]
mode = "auto"
stacks = ["any"]
risk = """TLS 1.0 and 1.1 have known weaknesses and are deprecated. Vercel accepts only TLS 1.2 and 1.3, so a host that accepts older versions is usually a non-Vercel server on a subdomain."""
build = """Allow only TLS 1.2 and 1.3 on every hostname. On self-managed servers set the minimum protocol version in the web server or load balancer config."""
proof = """1. Attempt a handshake to <host>:443 limited to TLS 1.1, then to TLS 1.0.
2. Attempt a handshake limited to TLS 1.2.
3. Pass: the server refuses both legacy handshakes with a protocol-version alert and TLS 1.2 succeeds.
4. Fail: either legacy handshake succeeds. Manual: a legacy handshake fails for another reason (handshake failure, reset, closed connection), which does not prove the version is refused."""
sources = [
  { title = "Vercel: Encryption and TLS", url = "https://vercel.com/docs/cdn-security/encryption" },
]

[[check]]
id = "INFRA-04"
title = "Sensitive files not served (.env, .git, backups, .DS_Store)"
severity = "critical"
layer = 7
cwe = ["CWE-538", "CWE-527"]
owasp = ["A01:2021", "A05:2021", "A01:2025", "A02:2025", "API8:2023"]
mode = "auto"
probe = "active"
stacks = ["any"]
risk = """A served .env hands out keys directly; a served /.git/ lets anyone rebuild source and history, including deleted secrets. Unit 42 (2024) traced an extortion campaign that harvested exposed .env files across about 110,000 domains; Truffle Security found /.git exposed on 4,500 of the top 1M sites."""
build = """Never put secrets, .git, dumps (*.sql, *.dump), archives (*.zip, *.tar.gz), *.bak or *.old under public/. Deploy through the Vercel git integration or `vercel deploy`, not a manual folder upload. Any other server that serves the site denies dotfiles."""
proof = """1. GET a fixed short list of paths on each production and preview host: /.env, /.env.local, /.env.production, /.git/HEAD, /.git/config, /backup.zip, /db.sql, /dump.sql, /.DS_Store. No crawling or fuzzing.
2. Count a path as exposed only if it returns 200 and the body looks like the real file: KEY=VALUE lines for .env (one line is enough, keys in any case, and most of the non-comment lines must be KEY=VALUE), "ref: refs/" for .git/HEAD, "[core]" for .git/config, SQL statements for dumps, the .DS_Store file signature. A 200 HTML page from an SPA catch-all route is not a finding. The page is the body, not the Content-Type: text/html still counts when the bytes are the real file and do not open with `<!doctype`, `<html>`, or another tag.
3. Pass: no path exposed.
4. Fail: any exposed path. Stop reading at the marker match, report it, and rotate every secret the file could contain."""
sources = [
  { title = "OWASP WSTG-CONF-04: Review Old Backup and Unreferenced Files", url = "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information" },
  { title = "Unit 42: Large-scale cloud extortion via exposed .env files", url = "https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/" },
  { title = "Truffle Security: 4,500 of the top 1M websites leaked source via .git", url = "https://trufflesecurity.com/blog/4500-of-the-top-1-million-websites-leaked-source-code-secrets" },
]

[[check]]
id = "INFRA-05"
title = "security.txt published"
severity = "low"
layer = 7
cwe = []
mode = "auto"
stacks = ["any"]
risk = """A researcher who finds a leaked key or dangling subdomain has no contact, so the report is dropped or posted publicly."""
build = """Add public/.well-known/security.txt with `Contact: mailto:security@<domain>` (a mailbox someone reads), `Expires:` within 12 months, and `Preferred-Languages`. Set a reminder before Expires."""
proof = """1. GET https://<host>/.well-known/security.txt. Redirects on the same site are followed (RFC 9116 allows them, up to 3 hops); a redirect to another host is reported as manual, because the scan does not leave the target.
2. Pass: 200, not HTML, a Contact: line, and an Expires: date in the future.
3. Warning: missing, HTML instead of text (for example an SPA page), no Contact or Expires, or Expires in the past. It is a disclosure-process gap, not a flaw in the site."""
sources = [
  { title = "RFC 9116: A File Format to Aid in Security Vulnerability Disclosure", url = "https://www.rfc-editor.org/rfc/rfc9116" },
]

[[check]]
id = "INFRA-06"
title = "SPF record restricts senders"
severity = "medium"
layer = 7
cwe = ["CWE-290"]
mode = "auto"
stacks = ["any"]
risk = """Missing SPF, or `+all`/`?all`, lets anyone send mail that passes as the domain. More than 10 DNS lookups gives a permerror, so receivers treat SPF as broken. SubdoMailing attackers re-registered abandoned domains still named in victims' SPF includes and sent mail that passed authentication."""
build = """Publish exactly one `v=spf1` TXT record at the apex listing only senders in use (for example Google Workspace, Resend). End with `-all`, or `~all` while DMARC is at p=reject. Domains that never send mail publish `v=spf1 -all`. Remove includes for services no longer used."""
proof = """1. Query TXT for the apex over DNS over HTTPS through a public resolver. Skipped with --no-dns.
2. Expand includes and redirects recursively through the same resolver (it stops once the limit is passed, so at most 11 queries) and count DNS-querying terms (include, a, mx, ptr, exists, redirect), as RFC 7208 4.6.4 does. A redirect is ignored when the record has an all mechanism; an include or redirect with a macro (%{...}) counts but is not expanded.
3. Pass: exactly one v=spf1 record, 10 or fewer lookups, every include and redirect resolves to exactly one SPF record, and the deciding record (the redirect target when there is no all) ends in -all or ~all. An ip4 or ip6 mechanism with prefix length 0 and a pass qualifier must not appear before that all. RFC 7208 stops at the first match, so `ip4:0.0.0.0/0 -all` matches every IPv4 address and the trailing all never runs. A fail or softfail qualifier on that mechanism, and an all that comes first, still pass. `a/0` and `mx/0` are not treated as a match of every address: they match only when the name has one.
4. Fail: none or more than one SPF record; +all, in the record, in an included record or in the redirect target; an ip4 or ip6 prefix of /0 with a pass qualifier before all, in the deciding record or in an included record; more than 10 lookups; an include or redirect that returns NXDOMAIN, has no SPF record or has more than one.
5. Warning: ?all, a ? qualifier on an ip4 or ip6 prefix of /0 before all, or no all mechanism."""
sources = [
  { title = "RFC 7208: Sender Policy Framework (SPF)", url = "https://www.rfc-editor.org/rfc/rfc7208" },
  { title = "Kaspersky: SubdoMailing domain hijacking", url = "https://www.kaspersky.com/blog/domain-hijacking-subdomailing/51097/" },
  { title = "Google: Email sender guidelines", url = "https://support.google.com/a/answer/81126" },
]

[[check]]
id = "INFRA-07"
title = "DMARC policy enforced"
severity = "medium"
layer = 7
cwe = ["CWE-290"]
mode = "auto"
stacks = ["any"]
risk = """Without DMARC enforcement anyone can send mail with the business's exact From address and receivers deliver it: invoice fraud, fake booking confirmations, lost deliverability. A May 2024 FBI/NSA/State advisory said North Korean Kimsuky actors picked domains with p=none so spoofed spearphishing got through."""
build = """Publish `_dmarc.<domain>` with `p=none; rua=mailto:...`, review reports for 2-4 weeks, then move to p=quarantine and p=reject. Add `sp=reject` for unused subdomains. Non-sending domains publish `v=DMARC1; p=reject`."""
proof = """1. Query TXT for _dmarc.<domain> over DNS over HTTPS through a public resolver. Skipped with --no-dns. If a subdomain has no record, query the organizational domain (RFC 7489 6.6.3) and judge its `sp=`, falling back to `p=`.
2. Pass: one v=DMARC1 record with p=quarantine or p=reject, pct absent or 100, and an rua tag.
3. Fail: no record, p=none (monitoring only), or pct below 100."""
sources = [
  { title = "RFC 7489: DMARC", url = "https://www.rfc-editor.org/rfc/rfc7489" },
  { title = "Dark Reading: Kimsuky abuses weak DMARC policies, feds warn", url = "https://darkreading.com/cloud-security/dprks-kimsuky-apt-abuses-weak-dmarc-policies-feds-warn" },
  { title = "Google: Email sender guidelines", url = "https://support.google.com/a/answer/81126" },
]

[[check]]
id = "INFRA-08"
title = "No secrets in git history or working tree"
severity = "critical"
layer = 7
cwe = ["CWE-798", "CWE-540"]
owasp = ["A02:2021", "A07:2021", "A04:2025", "A07:2025"]
mode = "review"
stacks = ["any"]
risk = """A key committed once lives in every clone and in history after the file is deleted. Toyota T-Connect had a data-server key on public GitHub from Dec 2017 to Sep 2022, putting 296,019 customer records at risk. For this stack the dangerous keys are Supabase service_role, database URLs with passwords, Vercel tokens, and Stripe, Resend or OpenAI keys."""
build = """Put `.env*` (except a placeholder `.env.example`) in .gitignore before the first commit. Keep secrets in Vercel env vars or Supabase secrets only. Enable GitHub secret scanning and push protection. Add a gitleaks pre-commit hook or CI job. If a secret was ever committed, rotate it first; rewriting history is optional and is not the fix. Secrets in the client bundle belong to NEXT-01."""
proof = """1. Run `gitleaks git --redact` (full history) and `gitleaks dir --redact` (working tree).
2. Run `git log --all --diff-filter=A --name-only` and check no .env file other than .env.example was ever added.
3. Confirm secret scanning and push protection are on in repo settings, or via `gh api repos/{owner}/{repo}` under security_and_analysis.
4. Pass: zero findings, or each finding is a documented test fixture. Fail: any live-looking key in history or tree."""
sources = [
  { title = "GitGuardian: Toyota exposed a secret key on GitHub for five years", url = "https://blog.gitguardian.com/toyota-accidently-exposed-a-secret-key-publicly-on-github-for-five-years/" },
  { title = "Infosecurity Magazine: Toyota T-Connect data leak", url = "https://www.infosecurity-magazine.com/news/toyota-data-leak-customers/" },
  { title = "GitHub changelog: secret scanning and push protection on by default for new public repos", url = "https://github.blog/changelog/2024-03-11-secret-scanning-and-push-protection-are-enabled-by-default-on-new-public-repositories/" },
  { title = "gitleaks", url = "https://github.com/gitleaks/gitleaks" },
]

[[check]]
id = "INFRA-09"
title = "DKIM signing passes for every sending service"
severity = "high"
layer = 7
cwe = ["CWE-290"]
mode = "assisted"
stacks = ["any"]
risk = """DMARC passes only when SPF or DKIM aligns with the From domain. A sender without DKIM (a booking tool, a newsletter service) either gets its legitimate mail rejected once DMARC is enforced or keeps the owner stuck at p=none."""
build = """Turn on DKIM for each service that sends as the domain (Google Workspace, Resend, Cal.com and similar), with 2048-bit keys where offered, and publish the selector records each service gives."""
proof = """1. The owner sends one message from each sending service to a mailbox the owner controls.
2. Read the Authentication-Results header of each message.
3. Pass: dkim=pass with header.d=<domain> and dmarc=pass for every service.
4. Fail: any service without an aligned DKIM pass. Never send spoofed test mail to anyone."""
sources = [
  { title = "Google: Email sender guidelines", url = "https://support.google.com/a/answer/81126" },
  { title = "RFC 7489: DMARC", url = "https://www.rfc-editor.org/rfc/rfc7489" },
]

[[check]]
id = "INFRA-10"
title = "No dangling DNS records (subdomain takeover)"
severity = "high"
layer = 7
cwe = ["CWE-672"]
owasp = ["A05:2021", "A02:2025"]
mode = "review"
stacks = ["any"]
risk = """A CNAME or A record still points at a deleted provider resource, so anyone can claim it and serve content on the subdomain: phishing on a trusted name, cookies scoped to the parent domain, and CSP or CORS allowlists that trust *.domain. A Mozilla subdomain pointed at Vercel but unclaimed was taken over (Bugzilla 1748078); SubdoMailing hijacked over 8,000 brand domains through dangling CNAMEs."""
build = """When deleting a Vercel project, Netlify site, S3 bucket or SaaS page, delete its DNS record in the same change, DNS first. Keep a DNS inventory in the repo. Do not rely on Vercel's _vercel TXT verification to prevent takeover."""
proof = """1. Export the zone from the DNS provider (preferred) or list hostnames from certificate transparency for the owner's domain.
2. For each CNAME and A record: resolve it; if it resolves, GET it over HTTPS.
3. Flag a record whose target is NXDOMAIN or whose response matches a known unclaimed-resource page (for example Vercel DEPLOYMENT_NOT_FOUND, S3 NoSuchBucket, GitHub Pages "There isn't a GitHub Pages site here").
4. Pass: no flagged records. Fail: any flagged record. Report it and delete the record; never attempt to claim the resource."""
sources = [
  { title = "Microsoft Learn: Prevent dangling DNS entries and avoid subdomain takeover", url = "https://learn.microsoft.com/en-us/azure/security/fundamentals/subdomain-takeover" },
  { title = "Mozilla Bugzilla 1748078: unclaimed Vercel subdomain taken over", url = "https://bugzilla.mozilla.org/show_bug.cgi?id=1748078" },
  { title = "Kaspersky: SubdoMailing domain hijacking", url = "https://www.kaspersky.com/blog/domain-hijacking-subdomailing/51097/" },
]

[[check]]
id = "INFRA-11"
title = "CAA records name only the CAs in use"
severity = "low"
layer = 7
cwe = ["CWE-295"]
owasp = ["A05:2021", "A02:2025"]
mode = "auto"
stacks = ["any"]
risk = """Without CAA any public CA may issue a certificate for the domain, so a mis-issuance or a takeover elsewhere yields a valid certificate. A CAA record that omits the CA the host uses (Let's Encrypt on Vercel) makes renewal fail. DNSSEC belongs to INFRA-27."""
build = """Publish `0 issue "letsencrypt.org"` plus any other CA actually in use, and `0 iodef "mailto:security@<domain>"`. Confirm every CA in use is listed before publishing."""
proof = """1. Query CAA for the site's hostname, climbing to the registered domain until a record set is found (RFC 8659), over DNS-over-HTTPS.
2. Read the issuer of the current certificate (as in INFRA-02) and map it to its CAA domain (Let's Encrypt: letsencrypt.org, Google Trust Services: pki.goog, and so on). For a wildcard certificate, issuewild records apply when present.
3. Pass: CAA records exist and allow the current issuer.
4. Warn: no CAA records. Fail: CAA records that do not allow the current issuer, so its renewal will be refused. Manual: the issuer is not in the tool's table."""
sources = [
  { title = "RFC 8659: DNS Certification Authority Authorization (CAA)", url = "https://www.rfc-editor.org/rfc/rfc8659" },
  { title = "Vercel: Encryption and TLS", url = "https://vercel.com/docs/cdn-security/encryption" },
]

[[check]]
id = "INFRA-12"
title = "MTA-STS and TLS-RPT protect inbound mail"
severity = "low"
layer = 6
cwe = ["CWE-319"]
mode = "auto"
stacks = ["any"]
risk = """Server-to-server mail uses opportunistic STARTTLS, which an on-path attacker can downgrade to plaintext. MTA-STS tells senders to require TLS to the domain's MX hosts. Worth adding once DMARC is enforced."""
build = """Publish `_mta-sts.<domain>` TXT (`v=STSv1; id=<n>`) and serve https://mta-sts.<domain>/.well-known/mta-sts.txt with mode: testing, then enforce, listing the real MX hosts. Add `_smtp._tls` TXT with an rua address."""
proof = """1. Query MX for <domain> (the site's host without www), TXT for _mta-sts.<domain> and TXT for _smtp._tls.<domain> over DNS-over-HTTPS. No MX: skip, the domain receives no mail.
2. When the record exists, GET https://mta-sts.<domain>/.well-known/mta-sts.txt with certificate verification and no redirects.
3. Pass: mode: enforce, every MX host matches an mx: line, and a TLS-RPT record with rua= exists.
4. Warn: no MTA-STS record, mode testing or none, or no TLS-RPT. Fail: policy file missing, invalid or behind a certificate that does not verify, or an MX host that no mx: line matches in enforce mode."""
sources = [
  { title = "RFC 8461: SMTP MTA Strict Transport Security (MTA-STS)", url = "https://www.rfc-editor.org/rfc/rfc8461" },
  { title = "RFC 8460: SMTP TLS Reporting", url = "https://www.rfc-editor.org/rfc/rfc8460" },
]

[[check]]
id = "INFRA-13"
title = "Dependencies locked, audited and install scripts restricted"
severity = "critical"
layer = 7
cwe = ["CWE-1395", "CWE-506", "CWE-829"]
owasp = ["A06:2021", "A08:2021", "A03:2025", "A08:2025"]
mode = "review"
stacks = ["node", "nextjs"]
risk = """Known-vulnerable versions ship to production, and malicious releases of real packages run at install time and steal tokens from dev machines and CI. CISA's 2025-09-23 alert on the Shai-Hulud worm reported 500+ compromised npm packages; Shai-Hulud 2.0 ran through a preinstall script in 800+ packages; the chalk/debug compromise (2025-09-08) came from a phished maintainer."""
build = """Commit the lockfile. CI and Vercel install with `npm ci` or `pnpm install --frozen-lockfile`. Prefer pnpm 10+ (dependency lifecycle scripts off by default, allow-list with onlyBuiltDependencies) or set `ignore-scripts=true` in .npmrc where the build allows. Add a release-age delay (pnpm minimumReleaseAge, Renovate or Dependabot cooldown). Enable Dependabot alerts and security updates. Use phishing-resistant MFA on npm and GitHub (INFRA-17)."""
proof = """1. Confirm the lockfile is tracked and `npm ci --dry-run` (or `pnpm install --frozen-lockfile --lockfile-only`) succeeds.
2. Run `npm audit --omit=dev --audit-level=high` (or `pnpm audit --prod`).
3. Search the lockfile for package versions named in the CISA and vendor IOC lists linked below.
4. Record whether install scripts are restricted.
5. Pass: lockfile in sync, zero high or critical advisories, no IOC hit. Fail: otherwise."""
sources = [
  { title = "CISA: Widespread Supply Chain Compromise Impacting npm Ecosystem", url = "https://www.cisa.gov/news-events/alerts/2025/09/23/widespread-supply-chain-compromise-impacting-npm-ecosystem" },
  { title = "Kaspersky Securelist: Shai-Hulud 2.0", url = "https://securelist.com/shai-hulud-2-0/118214/" },
  { title = "StepSecurity: chalk and debug packages compromised", url = "https://www.stepsecurity.io/blog/20-popular-npm-packages-compromised-chalk-debug-strip-ansi-color-convert-wrap-ansi" },
  { title = "pnpm v10.0.0 release notes", url = "https://github.com/pnpm/pnpm/releases/tag/v10.0.0" },
]

[[check]]
id = "INFRA-14"
title = "New dependencies vetted against typosquats"
severity = "high"
layer = 7
cwe = ["CWE-506", "CWE-829"]
owasp = ["A08:2021", "A03:2025"]
mode = "review"
stacks = ["node", "nextjs"]
risk = """A developer or coding agent installs a lookalike or hallucinated package name that an attacker registered, and it runs on install or ships destructive code. Socket found malicious packages mimicking React, Vue and Vite plugin names live for over two years with 6,200+ downloads."""
build = """Do not add a dependency without checking the exact name on npmjs.com: publisher, downloads, repository link, age. Prefer platform built-ins and official scoped packages (@supabase/*, @vercel/*). List every new dependency in the PR or change summary for the human."""
proof = """1. Diff package.json dependencies against the last release.
2. For each new direct dependency run `npm view <name> time.created maintainers repository`.
3. Flag packages created in the last 30 days, with no repository link, or whose name is one or two edits from a popular package.
4. Pass: no flags, or each flag acknowledged by the owner. Fail: an unacknowledged flag."""
sources = [
  { title = "Socket: malicious npm packages target React, Vue and Vite ecosystems", url = "https://socket.dev/blog/malicious-npm-packages-target-react-vue-and-vite-ecosystems-with-destructive-payloads" },
]

[[check]]
id = "INFRA-15"
title = "GitHub Actions pinned, least-privilege and injection-safe"
severity = "high"
layer = 7
cwe = ["CWE-829", "CWE-94", "CWE-250"]
owasp = ["A08:2021", "A03:2025"]
mode = "review"
stacks = ["any"]
risk = """A third-party action referenced by tag runs whatever the tag points to today; tj-actions/changed-files (CVE-2025-30066) had its tags rewritten to dump CI secrets into logs. pull_request_target runs with secrets on fork PRs; Ultralytics (Dec 2024) interpolated a branch name into a shell and attackers published cryptominer releases to PyPI."""
build = """Pin third-party actions to a full 40-character commit SHA with the version in a comment. Set top-level `permissions: contents: read` and raise per job only. Avoid pull_request_target; if required, never check out PR code. Pass untrusted context through env: and quote it; never put `${{ github.event.* }}` or `github.head_ref` inside run:. Set repo Workflow permissions to read. Use the Vercel git integration for deploys so fewer workflows exist."""
proof = """1. Parse .github/workflows/*.yml.
2. Check every uses: outside actions/*, github/* and local paths ends in @ plus 40 hex characters.
3. Check a top-level permissions: block exists.
4. Check there is no pull_request_target job that checks out github.event.pull_request.head.*, and no github.event.* or github.head_ref expression inside run:. zizmor automates these checks.
5. Pass: zero findings. Fail: any finding."""
sources = [
  { title = "GitHub Docs: Secure use reference for GitHub Actions", url = "https://docs.github.com/en/actions/reference/security/secure-use" },
  { title = "CISA: tj-actions/changed-files supply chain compromise (CVE-2025-30066)", url = "https://www.cisa.gov/news-events/alerts/2025/03/18/supply-chain-compromise-third-party-github-action-cve-2025-30066" },
  { title = "Snyk: Ultralytics pwn-request supply chain attack", url = "https://snyk.io/blog/ultralytics-ai-pwn-request-supply-chain-attack" },
]

[[check]]
id = "INFRA-16"
title = "Database reachable only from allowed networks over SSL"
severity = "high"
layer = 3
cwe = ["CWE-284", "CWE-319"]
owasp = ["A02:2021", "A05:2021", "A02:2025", "A04:2025"]
mode = "review"
stacks = ["supabase"]
risk = """With no network restriction, the Postgres port (direct and pooler) accepts connections from the whole internet and only a password stands between an attacker and the data. Supabase Network Restrictions cover direct Postgres and pooler connections, not the HTTPS APIs."""
build = """Set Supabase Network Restrictions to known CIDRs when nothing outside needs direct database access; Vercel functions use supabase-js over HTTPS. Turn on Enforce SSL for the database. RLS on the HTTPS API belongs to ACCESS-01."""
proof = """1. Run `supabase network-restrictions get --project-ref <ref> --experimental`.
2. Pass: a non-empty allowlist, or a written reason the database must stay open.
3. From an address outside the allowlist, attempt a direct connection to the database host with SSL disabled; expect refusal.
4. Fail: open to all addresses with no documented reason, or a non-SSL connection accepted."""
sources = [
  { title = "Supabase: Network Restrictions", url = "https://supabase.com/docs/guides/platform/network-restrictions" },
]

[[check]]
id = "INFRA-17"
title = "Phishing-resistant MFA on every account that controls the site"
severity = "critical"
layer = 7
cwe = ["CWE-308"]
owasp = ["A07:2021", "A07:2025"]
mode = "review"
stacks = ["any"]
risk = """Whoever takes over the GitHub, Vercel, Supabase, npm, registrar or DNS account controls the site, the data and the domain. The chalk/debug compromise began with a maintainer phished through a fake 2FA reset page; CISA's Shai-Hulud alert recommends phishing-resistant MFA."""
build = """Enable MFA on GitHub, Vercel, Supabase, npm, the registrar, the DNS host and the email provider, preferring passkeys or security keys over SMS. Enforce MFA at organization level where offered. Keep recovery codes offline."""
proof = """1. For each account, the owner opens its security settings and confirms MFA is on and which method.
2. Where an org-level setting exists, confirm MFA is required for all members.
3. Pass: every account has MFA, none relies on SMS alone. Fail: any account without MFA."""
sources = [
  { title = "CISA: More than a Password (MFA)", url = "https://www.cisa.gov/MFA" },
