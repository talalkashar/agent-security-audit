# auth: sign-in, passwords, recovery, OAuth, MFA and session lifetime.
# Owned elsewhere: secret keys in the client bundle (NEXT-01), middleware-only auth (NEXT),
# login rate limiting (API-01), session cookie flags (BROWSER-06), RLS (ACCESS-01).

[[check]]
id = "AUTH-01"
title = "Server authorization uses a verified identity, not getSession()"
severity = "critical"
layer = 7
cwe = ["CWE-287", "CWE-345"]
mode = "assisted"
stacks = ["nextjs", "supabase"]
risk = """On the server, `supabase.auth.getSession()` reads the session from the cookie without re-validating it. Anyone can edit that cookie, so a guard built on it renders another user's page or passes a check in Proxy/middleware, Server Components or Route Handlers."""
build = """On the server, decide who the user is with `supabase.auth.getClaims()` (verifies the JWT signature) or `supabase.auth.getUser()` (asks Supabase Auth). Use `getSession()` only when you need the raw token, never for authorization. Re-check identity inside every Server Component that loads private data, every Route Handler and every Server Action. Keep the secret/service_role key in a server-only module (`import 'server-only'`); a key that reaches the browser is NEXT-01."""
proof = """1. Repo: search `middleware.ts`/`proxy.ts`, `app/**/page.tsx`, `route.ts` and `"use server"` files for `getSession(`. Pass: none used for an authorization decision.
2. Sign in as test account A. Copy the `sb-<ref>-auth-token` cookie, decode its base64 JSON, change `user.id` and `email` to test account B's values, re-encode it without changing the signature, and request a protected page.
3. Pass: redirect to login, 401, or A's data. Fail: B's data or a page rendered as B.
Use only two test accounts you own."""
sources = [
  { title = "Supabase: Setting up Server-Side Auth for Next.js", url = "https://supabase.com/docs/guides/auth/server-side/nextjs" },
  { title = "Supabase: Understanding API keys", url = "https://supabase.com/docs/guides/api/api-keys" },
]

[[check]]
id = "AUTH-02"
title = "Password policy enforces length and rejects breached passwords"
severity = "medium"
layer = 7
cwe = ["CWE-521"]
mode = "assisted"
stacks = ["any"]
risk = """Short or breached passwords let credential stuffing and guessing succeed. In 2025 the UK ICO fined 23andMe £2.31m after a credential-stuffing breach, citing weak password protections and no mandatory MFA. Supabase leaked-password protection is off unless enabled."""
build = """Minimum length 8 when MFA is offered, 15 when it is not; allow at least 64 characters and never truncate. Check new passwords against a breached-password list: enable Supabase leaked password protection where the plan allows, or call the Pwned Passwords k-anonymity range API in your own sign-up and change-password actions. Do not impose composition rules (NIST 800-63B-4); Supabase's composition toggle is optional. Login throttling is API-01."""
proof = """1. Settings: read the Supabase Auth password settings (minimum length, leaked password protection) or your own validation code.
2. With a fresh test email you own, try to sign up with a short common password such as `password1`. Pass: rejected with a policy message.
3. Sign up with a 64-character passphrase, then log in with it. Pass: accepted and login works with the full string. Fail: rejected, or a truncated version also logs in.
4. Delete the test user."""
sources = [
  { title = "NIST SP 800-63B-4", url = "https://pages.nist.gov/800-63-4/sp800-63b.html" },
  { title = "Supabase: Password security", url = "https://supabase.com/docs/guides/auth/password-security" },
  { title = "ICO fines 23andMe £2.31 million", url = "https://ico-newsroom.prgloo.com/news/ico-fines-23andme-gbp-2-31-million-for-failing-to-protect-uk-users-genetic-data-1" },
]

[[check]]
id = "AUTH-03"
title = "Self-managed password hashes use Argon2id or bcrypt within 72 bytes"
severity = "high"
layer = 7
cwe = ["CWE-916", "CWE-328"]
mode = "review"
stacks = ["node"]
risk = """Apps that store their own credentials (Auth.js Credentials provider, custom user tables) sometimes use fast hashes like SHA-256 or MD5, which crack quickly after a database leak. bcrypt ignores input past 72 bytes, so hashing a password concatenated with other fields can make different inputs verify as equal."""
build = """Prefer a managed auth provider such as Supabase Auth, which stores hashes for you. If you must store passwords, use Argon2id (`@node-rs/argon2`) with at least m=19 MiB, t=2, p=1, or bcrypt cost 10 or more with input limited to 72 bytes. Never use `crypto.createHash` on passwords, never bcrypt a concatenation of identifiers and password, and never log or return hashes."""
proof = """1. Repo: find every place a password is hashed or compared. Pass: Argon2id or bcrypt with the parameters above; no `crypto.createHash`, `md5` or `sha` on passwords.
2. If bcrypt is used: with a test account you own, set a password longer than 72 bytes, then log in with only its first 72 bytes. Pass: login rejected (or the long password was refused at sign-up). Fail: login succeeds.
Skip this check if no password hashes are stored by the app."""
sources = [
  { title = "OWASP Password Storage Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html" },
]

[[check]]
id = "AUTH-04"
title = "Login, sign-up and reset do not reveal which accounts exist"
severity = "medium"
layer = 7
cwe = ["CWE-204"]
mode = "assisted"
stacks = ["any"]
risk = """Different messages, status codes or timing for unknown versus known emails let attackers build a list of real accounts for stuffing and phishing. With Supabase "Confirm email" off, `signUp` answers "User already registered"; app code can re-add the leak by looking up profiles by email or branching on `identities.length`."""
build = """Keep Supabase "Confirm email" on. Show one message per flow: login failure "Email or password is incorrect", sign-up "Check your email to continue", reset "If an account exists, we sent a link". Do not branch UI on `identities` length. Do not expose any RPC or route that looks up users by email to anonymous callers."""
proof = """1. Use one registered test email you own and one never-used address.
2. Call login, sign-up and forgot-password for each, 5 times.
3. Compare status codes, response bodies and median response time.
4. Pass: identical status and body, timing difference under about 100 ms. Fail: different message or status, or a consistent timing gap.
5. Delete any test rows created."""
sources = [
  { title = "OWASP Authentication Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html" },
  { title = "supabase/auth #1517: signUp returns User already registered", url = "https://github.com/supabase/auth/issues/1517" },
]

[[check]]
id = "AUTH-05"
title = "Reset and magic links use a fixed site URL, not request headers"
severity = "high"
layer = 7
cwe = ["CWE-640", "CWE-644"]
mode = "assisted"
stacks = ["any"]
risk = """If a reset or magic-link URL is built from `Host`, `X-Forwarded-Host` or the request origin, a reset requested with a spoofed host sends the victim a link that delivers their token to another domain. In Supabase apps the usual pattern is `redirectTo` set to `${origin}/auth/callback` with `origin` read from request headers."""
build = """Build `redirectTo` and `emailRedirectTo` from a configured value (`NEXT_PUBLIC_SITE_URL` or `SITE_URL`), never from request headers. Keep the Supabase Redirect URL allow list exact in production (AUTH-06). For a custom reset flow: random token from a CSPRNG, short expiry, single use, `Referrer-Policy: no-referrer` on the reset page, no automatic login after reset."""
proof = """1. Repo: find where `redirectTo`, `emailRedirectTo` or reset URLs are built. Pass: from a configured site URL only.
2. Request a reset for your own test account with `X-Forwarded-Host: attacker-check.invalid`, and for Supabase also `redirectTo=https://attacker-check.invalid/x`.
3. Open the email in the test inbox. Pass: link points to the real site domain, or the request is rejected. Fail: link contains the spoofed host."""
sources = [
  { title = "OWASP Forgot Password Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html" },
  { title = "Supabase: Redirect URLs", url = "https://supabase.com/docs/guides/auth/redirect-urls" },
]

[[check]]
id = "AUTH-06"
title = "OAuth and magic-link redirect allow list is exact"
severity = "high"
layer = 7
cwe = ["CWE-601"]
mode = "assisted"
stacks = ["supabase", "nextjs", "vercel"]
risk = """Auth codes, magic links and recovery tokens are delivered to the redirect URL. A production allow list with `https://*.vercel.app/**` or `https://**` lets anyone who can deploy to a matching domain receive another user's tokens. In 2023 Salt Labs showed account takeover on Booking.com through a manipulated OAuth redirect_uri."""
build = """Production Supabase project allow list: exact production URLs only. Put preview wildcards in a separate staging project, or scope them to your own team pattern (`https://<project>-*-<team>.vercel.app/**`), never `*.vercel.app`. Validate every `next`, `callbackUrl` or `returnTo` parameter as a relative path: starts with `/`, not `//`."""
proof = """1. Dashboard: read Authentication > URL Configuration. Pass: no `**` or `*.vercel.app` entries in production.
2. Request `GET /auth/v1/authorize?provider=<enabled provider>&redirect_to=https://evil-check.vercel.app/`. Pass: final redirect falls back to the Site URL. Fail: redirect targets the foreign domain.
3. Request a magic link for your own test account with `redirectTo` set to that domain. Pass: the emailed link uses the Site URL.
4. The `next` parameter on `/auth/callback` is tested with the other redirect parameters in BROWSER-15."""
sources = [
  { title = "Supabase: Redirect URLs", url = "https://supabase.com/docs/guides/auth/redirect-urls" },
  { title = "Salt Labs: OAuth account takeover on Booking.com", url = "https://salt.security/blog/traveling-with-oauth-account-takeover-on-booking-com" },
]

[[check]]
id = "AUTH-07"
title = "OAuth flow validates state and PKCE"
severity = "high"
layer = 7
cwe = ["CWE-352", "CWE-345"]
mode = "assisted"
stacks = ["nextjs", "supabase", "node"]
risk = """Without a bound `state` and PKCE verifier, an attacker can complete a victim's OAuth callback with the attacker's code (login CSRF, unwanted account linking) or replay an intercepted code. next-auth before 4.20.1 (CVE-2023-27490) let these checks be skipped."""
build = """Use the library flow, not a hand-written one. Supabase: `@supabase/ssr` uses PKCE by default; call `exchangeCodeForSession` in the callback route. Auth.js: keep the default `checks: ['pkce', 'state']` and stay on a patched version. Never accept tokens from URL fragments on the server."""
proof = """1. Run `npm ls next-auth @auth/core @supabase/ssr @supabase/supabase-js` and compare versions with published advisories. Pass: none in an affected range.
2. Start sign-in with the provider and capture the authorize URL. Pass: it contains `state` and `code_challenge` with `code_challenge_method=S256`.
3. From a fresh client with no PKCE cookie, call the app callback with a code. Pass: error, no session cookie set. Fail: a session is issued."""
sources = [
  { title = "GHSA-7r7x-4c4q-c4qf: next-auth OAuth state/nonce/PKCE check bypass", url = "https://github.com/advisories/GHSA-7r7x-4c4q-c4qf" },
]

[[check]]
id = "AUTH-08"
title = "Logout and password change end sessions on the server"
severity = "medium"
layer = 5
cwe = ["CWE-613"]
mode = "assisted"
stacks = ["supabase", "nextjs"]
risk = """If logout only deletes the cookie, a copied token keeps working. Supabase access JWTs stay valid until `exp` unless the app checks `session_id`; Auth.js JWT sessions cannot be revoked before expiry. After a password reset, other devices often stay signed in."""
build = """Logout calls `supabase.auth.signOut()` on the server and clears cookies; use scope `global` for "sign out everywhere" and after a password change or reset. Keep JWT expiry at 1 hour or less (Supabase default). For sensitive actions, confirm the JWT `session_id` exists in `auth.sessions`. With Auth.js, use the database session strategy when instant revocation matters. Cookie flags are BROWSER-06."""
proof = """1. Log in as a test account; save the cookies and refresh token. Log out.
2. Send the old refresh token to `/auth/v1/token?grant_type=refresh_token`. Pass: rejected. Fail: new tokens issued.
3. After the access token's `exp`, request a protected page with the old cookie. Pass: redirect to login.
4. Repeat with a password change made from a second session. Pass: the first session can no longer refresh."""
sources = [
  { title = "Supabase: User sessions", url = "https://supabase.com/docs/guides/auth/sessions" },
  { title = "Auth.js: Session strategies", url = "https://authjs.dev/concepts/session-strategies" },
  { title = "OWASP Session Management Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html" },
]

[[check]]
id = "AUTH-09"
title = "MFA is enforced in RLS and server code, not only in the UI"
severity = "high"
layer = 7
cwe = ["CWE-308", "CWE-287"]
mode = "assisted"
stacks = ["supabase"]
risk = """Supabase MFA only raises the session's `aal` claim. Without checks on `aal2` in RLS, APIs and server rendering, a stolen password still yields an `aal1` session that reads the data. The ICO cited the absence of mandatory MFA in its 2025 fine against 23andMe."""
build = """For users with a verified factor, and always for admin and staff roles, add `as restrictive` RLS policies requiring `(select auth.jwt()->>'aal') = 'aal2'`. Check `aal` in Server Components and Route Handlers and redirect to the MFA step. Require MFA for admin accounts."""
proof = """1. With an MFA-enrolled test account, sign in with password only (aal1).
2. Query a protected table through the Supabase REST API with that token. Pass: empty result or 403. Fail: rows returned.
3. Load an MFA-gated page with the same session. Pass: redirect to the MFA challenge."""
sources = [
  { title = "Supabase: Multi-Factor Authentication", url = "https://supabase.com/docs/guides/auth/auth-mfa" },
  { title = "ICO fines 23andMe £2.31 million", url = "https://ico-newsroom.prgloo.com/news/ico-fines-23andme-gbp-2-31-million-for-failing-to-protect-uk-users-genetic-data-1" },
]

[[check]]
id = "AUTH-10"
title = "Tokens kept out of localStorage and JWTs verified with a pinned algorithm"
severity = "medium"
layer = 5
cwe = ["CWE-922", "CWE-347"]
mode = "assisted"
stacks = ["nextjs", "supabase", "node"]
risk = """Access and refresh tokens in `localStorage` are taken by any XSS. Custom JWT verification that trusts the token's own `alg`, accepts unsigned tokens or uses a weak HMAC secret lets anyone forge a token; jsonwebtoken up to 4.2.1 (CVE-2015-9235) accepted such tokens."""
build = """In Next.js use `@supabase/ssr` (cookie storage), not the default `supabase-js` localStorage, and never copy tokens into localStorage yourself. When verifying JWTs yourself (webhooks, custom APIs), pin `algorithms` to the exact expected value (e.g. `['ES256']`), verify `exp`, `aud` and `iss`, use the Supabase JWKS for asymmetric keys, and never use `jwt.decode` for authorization. A CSP (BROWSER-02) limits XSS impact."""
proof = """1. Headless browser: log in with a test account and list `Object.keys(localStorage)`. Pass: no `sb-*-auth-token` or `access_token` keys.
2. Send each custom API a copy of a valid test-account token with its signature removed and its header set to an unsigned algorithm. Pass: 401. Fail: 200.
3. Repo: search for `jwt.decode` or `verify(` calls without an `algorithms` option. Pass: none used for authorization."""
sources = [
  { title = "OWASP HTML5 Security Cheat Sheet", url = "https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html" },
  { title = "OSV: CVE-2015-9235 jsonwebtoken verification bypass", url = "https://osv.dev/vulnerability/CVE-2015-9235" },
]

[[check]]
id = "AUTH-11"
title = "Email verified before account access or identity linking"
severity = "high"
layer = 7
cwe = ["CWE-287", "CWE-284"]
mode = "assisted"
stacks = ["any"]
risk = """If an account works before its email is confirmed, or OAuth identities auto-link to an unverified email, an attacker can pre-create the victim's account and keep access after the victim joins; a 2022 study found 35 of 75 popular services vulnerable. next-auth CVE-2022-35924 sent sign-in emails to an unintended address."""
build = """Keep Supabase "Confirm email" on and grant no access (no profile or org rows with privileges) until `email_confirmed_at` is set. Auto-link OAuth identities only on provider-verified emails; in Auth.js do not set `allowDangerousEmailAccountLinking`. Keep next-auth and nodemailer patched. Enable Supabase "Secure email change" so both old and new addresses confirm."""
proof = """1. Sign up with a new test address you own and do not click the confirmation link.
2. Try to sign in and call a protected API. Pass: sign-in refused ("Email not confirmed") or no data. Fail: an authenticated session with access.
3. Dashboard: confirm "Confirm email" and "Secure email change" are on.
4. Delete the test user."""
sources = [
  { title = "MSRC: Pre-hijacking attacks", url = "https://msrc.microsoft.com/blog/2022/05/pre-hijacking-attacks" },
  { title = "Account pre-hijacking paper (Sudhodanan, Paverd)", url = "https://arxiv.org/abs/2205.10174v1" },
  { title = "GHSA-xv97-c62v-4587: next-auth email sign-in misdirection", url = "https://cve.circl.lu/vuln/ghsa-xv97-c62v-4587" },
]
